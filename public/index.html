          if (firstG) tds += `<td class="g-goal" rowspan="${span(i, kG)}">${planEscape(r[0])}</td>`;
          if (firstS) tds += `<td class="g-strat" rowspan="${span(i, kS)}">${planEscape(r[1])}</td>`;
          if (firstT) {
            const rc = tactRes.get(String(r[2]).trim()) || 0;
            const badge = rc ? `<span class="svod-res" title="Прикреплено результатов">📎 ${rc}</span>` : '';
            const tid = tactId.get(String(r[2]).trim());
            const titleHtml = tid
              ? `<a class="svod-tlink" href="https://${planEscape(portal)}/company/personal/user/0/tasks/task/view/${tid}/" target="_blank" rel="noopener" title="Открыть задачу в Bitrix">${planEscape(r[3])}</a>`
              : planEscape(r[3]);
            tds += `<td class="g-tnum" rowspan="${span(i, kT)}">${planEscape(r[2])}</td><td class="g-ttask" rowspan="${span(i, kT)}">${titleHtml}${badge}</td>`;
          }
          const mark = st === 'done' ? '<span style="color:#22a06b;font-weight:900;margin-right:6px">✓</span>'
                     : st === 'overdue' ? '<span style="color:#ef4444;font-weight:900;margin-right:6px">●</span>'
                     : st === 'pending' ? '<span style="color:#b0b6ae;font-weight:900;margin-right:6px">○</span>' : '';
          tds += `<td class="g-snum">${planEscape(r[4])}</td>`;
          tds += `<td class="g-sub">${mark}${planEscape(r[5])}</td>`;
          tds += `<td class="g-form">${planEscape(r[6])}</td>`;
          tds += `<td class="g-due${st === 'overdue' ? ' over' : ''}">${planEscape(r[7])}</td>`;
          // Команда — одна ячейка на тактическую задачу (объединена по строкам).
          if (firstT) tds += `<td class="g-team" rowspan="${span(i, kT)}">${teamCell(r[2])}</td>`;
          // Жирнее разделитель между тактическими задачами.
          body += `<tr class="${firstT && i > 0 ? 'tstart' : ''}" style="${trBg}">${tds}</tr>`;
        }
        const cols = [210, 175, 56, 300, 66, 330, 175, 84, 220].map(w => `<col style="width:${w}px">`).join('');
        const headers = ['Стратегические цели', 'Стратегические задачи', '№', 'Тактические задачи', '№', 'Тактические подзадачи', 'Форма результата', 'Срок', 'Команда'];
        const headTh = headers.map(h => `<th>${planEscape(h)}</th>`).join('');
        const chip = (key, label, n, cls) =>
          `<button class="svod-chip${f === key ? ' active' : ''}${cls ? ' ' + cls : ''}" data-f="${key}">${label} <b>${n}</b></button>`;
        // Цели — мультивыбор (римская метка + полное название в подсказке).
        const goalsList = [...new Set(s.rows.map(r => r[0]))];
        const romanOf = t => (String(t).match(/^([IVX]+)\./) || [, ''])[1] || String(t).slice(0, 2);
        const goalChips = goalsList.map(g =>
          `<button class="svod-gchip${goalSel.includes(g) ? ' active' : ''}" data-g="${planEscape(g)}" title="${planEscape(g)}">${planEscape(romanOf(g))}</button>`).join('');
        const shownN = rows.filter(r => statusOf(r[4])).length;
        const summary = `<div class="svod-summary">
            <span><b style="color:#22a06b">${doneN}</b> выполнено</span>
            <span><b style="color:#ef4444">${overN}</b> просрочено</span>
            <span><b style="color:#8a8f88">${pendN}</b> в работе</span>
            <span>Прогресс: <b>${factPct}%</b></span>
            <span><b>📎 ${totalResults}</b> результатов</span>
          </div>
          <div class="svod-toolbar">
            <span class="svod-search"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
              <input id="svodSearch" type="text" placeholder="Поиск по таблице…" value="${planEscape(planState.svodQ || '')}" autocomplete="off"></span>
            <div class="svod-chips">
              ${chip('all', 'Все', totalN)}
              ${chip('overdue', '● Просрочено', overN, 'c-over')}
              ${chip('pending', '○ В работе', pendN, 'c-pend')}
              ${chip('done', '✓ Выполнено', doneN, 'c-done')}
              ${chip('results', '📎 С результатами', resTactN, 'c-res')}
            </div>
            <label class="svod-hide"><input type="checkbox" id="svodHideDone"${planState.hideDone ? ' checked' : ''}> Скрыть выполненные</label>
          </div>
          <div class="svod-goals"><span class="svod-goals-lbl">Цели:</span>${goalChips}${goalSel.length ? `<button class="svod-gchip svod-gclear" data-g="__clear">Сброс</button>` : ''}</div>`;
        ids.planWrap.innerHTML = `<div id="planScaler">
            ${summary}
            <div class="svod-wrap">${rows.length ? `<table class="svod-table"><colgroup>${cols}</colgroup>
              <thead><tr>${headTh}</tr></thead><tbody>${body}</tbody></table>` : `<div style="padding:40px;text-align:center;color:var(--text-muted)">Ничего не найдено</div>`}</div>
          </div>`;
        const hd = document.getElementById('svodHideDone');
        if (hd) hd.addEventListener('change', () => { planState.hideDone = hd.checked; drawPlanExcel(); });
        document.querySelectorAll('.svod-chip').forEach(c => c.addEventListener('click', () => {
          planState.svodF = c.dataset.f; drawPlanExcel();
        }));
        document.querySelectorAll('.svod-gchip').forEach(c => c.addEventListener('click', () => {
          const g = c.dataset.g;
          if (g === '__clear') { planState.svodGoals = []; }
          else {
            const set = new Set(planState.svodGoals);
            set.has(g) ? set.delete(g) : set.add(g);   // мультивыбор
            planState.svodGoals = [...set];
          }
          drawPlanExcel();
        }));
        const se = document.getElementById('svodSearch');
        if (se) {
          let t0;
          se.addEventListener('input', () => {
            clearTimeout(t0);
            const caret = se.selectionStart;
            t0 = setTimeout(() => {
              planState.svodQ = se.value;
              drawPlanExcel();
              const s2 = document.getElementById('svodSearch');
              if (s2) { s2.focus(); try { s2.setSelectionRange(caret, caret); } catch (e) {} }
            }, 180);
          });
        }
        bindPlanToggle();
      }

      async function renderPlan() {
        ids.tableWrap.hidden = true;
        ids.galleryWrap.hidden = true;
        ids.zrsWrap.hidden = true;
        ids.aiAnalysisWrap.hidden = true;
        if (ids.planTasksWrap) ids.planTasksWrap.hidden = true;
        if (ids.planWrap) ids.planWrap.hidden = false;

        if (planState.loading) return;
        if (planState.data) { drawPlan(planState.data); return; }

        ids.planWrap.innerHTML = `<div style="text-align:center;padding:48px;color:var(--text-muted)">Загружаем план ОП 2026…</div>`;
        planState.loading = true;
        let painted = false;
        // Cache-first: the live /api/op-plan is slow from this region, so paint
        // the saved snapshot instantly, then try to refresh in the background.
        try {
          const cr = await fetch('/op-plan-cache.json', { cache: 'no-store' });
          if (cr.ok) {
            const cj = await cr.json();
            if (cj && Array.isArray(cj.goals)) { planState.data = cj; drawPlan(cj); painted = true; }
          }
        } catch {}
        try {
          const controller = new AbortController();
          const timer = setTimeout(() => controller.abort(), 15000);
          let j;
          try {
            const r = await fetch('/api/op-plan', { signal: controller.signal });
            j = await r.json();
          } finally { clearTimeout(timer); }
          if (!j.ok) throw new Error(j.error || 'Ошибка загрузки');
          planState.data = j;
          drawPlan(j);
          painted = true;
        } catch (e) {
          if (!painted) ids.planWrap.innerHTML = `<div style="text-align:center;padding:48px;color:#ef4444">Ошибка: ${e.message}</div>`;
        } finally {
          planState.loading = false;
        }
      }

      const PLAN_COLORS = { done: '#22c55e', overdue: '#ef4444', soon: '#f97316' };

      function planEscape(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c]));
      }

      function planDate(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        return isNaN(d) ? '' : d.toLocaleDateString('ru-RU', { day: '2-digit', month: '2-digit' });
      }

      // Urgency heat 0–5: the closer (or more overdue) the deadline, the hotter.
      function planFireLevel(deadline) {
        if (!deadline) return 0;
        const dt = new Date(deadline).getTime();
        if (isNaN(dt)) return 0;
        const days = (dt - Date.now()) / 864e5;
        if (days < 0) return 5;           // overdue — hottest
        if (days <= 1) return 4;          // today / tomorrow
        if (days <= 3) return 3;
        if (days <= 6) return 2;
        if (days <= 9) return 1;
        return 0;                         // further out — not burning
      }

      const RU_DOW = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];
      // Date with a short weekday, e.g. "06.08 Ср".
      function planDateDow(iso) {
        if (!iso) return '';
        const d = new Date(iso);
        if (isNaN(d)) return '';
        return `${planDate(iso)} ${RU_DOW[d.getDay()]}`;
      }

      // Round avatar with initials fallback; the image (if any) covers the initials.
      function planAvatar(person, size, ring) {
        if (!person || !person.name) return '';
        size = size || 22; ring = ring || '#7cc437';
        const initials = planEscape(person.name.split(/\s+/).map(w => w[0] || '').slice(0, 2).join('').toUpperCase());
        const img = person.avatar
          ? `<img src="${planEscape(person.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">`
          : '';
        return `<span title="${planEscape(person.name)}" style="position:relative;display:inline-grid;place-items:center;width:${size}px;height:${size}px;border-radius:50%;overflow:hidden;background:#e8efe0;color:#4a7a1e;font-size:${Math.round(size * 0.4)}px;font-weight:800;box-shadow:0 0 0 2px #fff, 0 0 0 3.5px ${ring};flex-shrink:0">${initials}${img}</span>`;
      }

      // Overlapping, vertically-staggered avatar cluster (some higher, some lower).
      function planPeopleCluster(people, size) {
        size = size || 32;
        if (!people.length) return '';
        const overlap = Math.round(size * 0.34);
        const chips = people.map((x, i) => {
          const dy = (i % 2 === 0) ? -4 : 5; // stagger up / down
          return `<span style="margin-left:${i ? -overlap : 0}px;transform:translateY(${dy}px);position:relative;z-index:${1000 - i}">${planAvatar(x.person, size, x.ring)}</span>`;
        }).join('');
        const names = planEscape(people.map(x => x.person.name).join(', '));
        return `<span title="${names}" style="display:inline-flex;align-items:center;flex-shrink:0;padding:8px 4px 8px 2px">${chips}</span>`;
      }

      function planStepRow(s, now) {
        const overdue = !s.done && s.deadline && new Date(s.deadline).getTime() < now;
        const mark = s.done ? '✓' : (overdue ? '!' : '○');
        const markColor = s.done ? '#22a06b' : (overdue ? '#ef4444' : '#b0b6ae');
        const people = [
          ...(s.executors || []).map(p => planAvatar(p, 22, '#7cc437')),
          ...(s.observers || []).map(p => planAvatar(p, 22, '#3b82f6'))
        ].join('');
        return `<div style="display:flex;align-items:center;gap:10px;padding:11px 4px 11px 2px;font-size:21px;border-top:1px dashed rgba(0,0,0,.07)">
          <span style="color:${markColor};font-weight:800;flex-shrink:0;width:21px;text-align:center;font-size:22px">${mark}</span>
          <span style="flex:1;min-width:0;line-height:1.5;overflow-wrap:break-word;color:${s.done ? 'var(--text-muted)' : 'var(--text-main)'};${s.done ? 'text-decoration:line-through' : ''}">${planEscape(s.text)}</span>
          ${people ? `<span style="display:flex;gap:3px;flex-shrink:0">${people}</span>` : ''}
          <span style="color:${overdue ? '#ef4444' : 'var(--text-muted)'};flex-shrink:0;font-weight:800;min-width:92px;text-align:right;font-size:23px;text-decoration:underline;text-underline-offset:3px">${planDateDow(s.deadline)}</span>
        </div>`;
      }

      // A tactical task belongs to the period when its own "Крайний срок" (the Bitrix
      // DEADLINE field) falls inside the window — not when its steps happen to.
      function planTactInPeriod(tact, range) {
        if (!range) return true;
        if (!tact.deadline) return false;
        const dt = new Date(tact.deadline).getTime();
        return dt >= range.start.getTime() && dt <= range.end.getTime();
      }

      // Roll the task's steps up into counters. Every step counts: the period selects
      // whole tasks, so a task in the window is shown with all of its progress.
      function planTactStats(tact, now) {
        const steps = tact.steps || [];
        let done = 0, overdue = 0, soon = 0;
        for (const s of steps) {
          if (s.done) { done++; continue; }
          if (!s.deadline) continue;
          const dt = new Date(s.deadline).getTime();
          if (dt < now) overdue++;
          else if (dt - now <= 14 * 864e5) soon++;
        }
        return { ...tact, totalSteps: steps.length, doneSteps: done, overdueSteps: overdue, soonSteps: soon };
      }

      function drawPlan(j) {
        const rawGoals = j.goals || [];
        if (!rawGoals.length) {
          ids.planWrap.innerHTML = `<div style="text-align:center;padding:48px;color:var(--text-muted)">В группе ОП 2026 нет задач с тегами вида «ОП2026:1.1»</div>`;
          return;
        }

        // Excel-вид (лист «Свод Финал») — отдельная отрисовка.
        if (planState.excel) { drawPlanExcel(); return; }

        const pct = (d, t) => t ? Math.round(d / t * 100) : 0;
        const sum = (arr, key) => arr.reduce((a, x) => a + x[key], 0);

        const period = state.period || 'all';
        const range = getPeriodRange(period);
        const now = Date.now();

        // Поиск по человеку из навбара: оставляем только задачи, где он участвует
        // (ответственный, наблюдатель или в шагах чек-листа).
        const q = (state.searchQuery || '').toLowerCase().trim();
        const tactMatchesPerson = t => {
          if (!q) return true;
          const names = [];
          if (t.responsible) names.push(t.responsible.name);
          (t.observers || []).forEach(o => names.push(o.name));
          (t.steps || []).forEach(s => {
            (s.executors || []).forEach(p => names.push(p.name));
            (s.observers || []).forEach(p => names.push(p.name));
          });
          return names.some(n => String(n || '').toLowerCase().includes(q));
        };

        // Recompute every aggregate from the tasks in the period, bottom-up
        const goals = rawGoals.map(g => {
          const tacts = g.children
            .flatMap(s => s.tacts || [])
            .filter(t => planTactInPeriod(t, range) && tactMatchesPerson(t))
            .map(t => planTactStats(t, now));

          return {
            ...g,
            tacts,
            totalSteps: sum(tacts, 'totalSteps'),
            doneSteps: sum(tacts, 'doneSteps'),
            overdueSteps: sum(tacts, 'overdueSteps'),
            soonSteps: sum(tacts, 'soonSteps')
          };
        });

        // Header keeps the plan's full scale; the metric strip reflects the period
        const allStrat = rawGoals.flatMap(g => g.children || []);
        const allTacts = allStrat.flatMap(s => s.tacts || []);
        const scale = {
          goals: rawGoals.length,
          strat: allStrat.length,
          tact: allTacts.length,
          steps: allTacts.reduce((a, t) => a + (t.steps || []).length, 0)
        };

        const T = {
          tact: goals.reduce((a, g) => a + g.tacts.length, 0),
          steps: sum(goals, 'totalSteps'),
          done: sum(goals, 'doneSteps'),
          overdue: sum(goals, 'overdueSteps'),
          soon: sum(goals, 'soonSteps')
        };

        // ── Metric strip ────────────────────────────────────────────────
        const metric = (label, value, color) => `
          <div style="background:var(--surface);border:1px solid rgba(233,235,232,.8);border-radius:13px;
                      padding:11px 16px;box-shadow:0 3px 10px rgba(0,0,0,.01);flex:1;min-width:130px">
            <div style="font-size:11px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--text-muted)">${label}</div>
            <strong style="font-size:25px;font-weight:900;color:${color || 'var(--text-main)'};line-height:1.2">${value}</strong>
          </div>`;

        const metrics = [
          metric('Прогресс плана', T.steps ? pct(T.done, T.steps) + '%' : '—', '#5a9a1a'),
          metric(range ? 'Задач в периоде' : 'Задач всего', T.tact),
          metric('Выполнено', T.done, PLAN_COLORS.done),
          metric('Просрочено', T.overdue, PLAN_COLORS.overdue),
          metric('Горит (≤14 дн)', T.soon, PLAN_COLORS.soon)
        ].join('');

        // ── Goal cards ──────────────────────────────────────────────────
        // Goals with nothing due in the period are dropped, not shown empty
        const shownGoals = goals.filter(g => g.tacts.length > 0);

        // Flat list of tactical tasks (no Roman-numeral goal grouping): each
        // tactical task is its own card, overdue first, then nearest deadline.
        // Distinct accent colour per goal (by its number).
        const GOAL_COLORS = ['#3b82f6', '#8b5cf6', '#ec4899', '#f59e0b', '#0ea5e9', '#14b8a6', '#ef4444', '#6366f1', '#84cc16', '#d946ef'];
        const goalColor = num => GOAL_COLORS[((Number(num) || 1) - 1) % GOAL_COLORS.length];

        // Keep tasks of the same goal next to each other: group by goal, then
        // overdue-first and nearest deadline within the goal.
        const flatTacts = goals
          .flatMap(g => g.tacts.map(t => Object.assign(t, { _goalTitle: g.title, _goalCode: g.code, _goalNum: g.num })))
          .sort((a, b) => ((a._goalNum || 0) - (b._goalNum || 0))
            || (b.overdueSteps > 0) - (a.overdueSteps > 0)
            || String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')));

        // Balance cards over two rows: columns-per-row = ceil(N/2).
        // 5→3+2, 6→3+3, 7→4+3, 8→4+4 … (capped so huge sets still wrap sanely).
        const planCols = Math.max(1, Math.min(5, Math.ceil(flatTacts.length / 2)));
        const cardBasis = `calc(${(100 / planCols).toFixed(4)}% - 14px)`;

        // Одна карточка тактической задачи (тактическая задача + её подзадачи-шаги).
        // basis — гибкая ширина в flex-раскладке.
        let planHideDoneSteps = false; // при большом числе карточек прячем выполненные пункты
        // Служебный пункт «Указать результат…» не показываем никогда.
        const isBoilerStep = s => /указать результат/i.test(String(s && s.text || ''));
        const renderTactCard = (t, basis) => {
          const p = pct(t.doneSteps, t.totalSteps);
          const color = t.overdueSteps > 0 ? PLAN_COLORS.overdue
                      : p === 100        ? PLAN_COLORS.done
                      : t.soonSteps > 0  ? PLAN_COLORS.soon
                      : 'var(--text-muted)';
          const hasOverdue = t.overdueSteps > 0;
          const stepsHtml = (t.steps || [])
            .filter(s => !isBoilerStep(s))
            .filter(s => !(planHideDoneSteps && s.done))
            .slice()
            .sort((a, b) => (a.done === b.done ? 0 : a.done ? 1 : -1)
              || String(a.deadline || '9999').localeCompare(String(b.deadline || '9999')))
            .map(s => planStepRow(s, now))
            .join('') || `<div style="padding:6px 4px;color:var(--text-muted);font-size:12px">Шаги не заданы</div>`;
          const peopleRow = [
            ...(t.responsible ? [{ person: t.responsible, ring: '#7cc437' }] : []),
            ...(t.observers || []).map(o => ({ person: o, ring: '#3b82f6' }))
          ];
          const gColor = goalColor(t._goalNum);
          // Completed tasks don't burn, no matter the date.
          const heat = p === 100 ? 0 : planFireLevel(t.deadline);
          const burnBorder = heat >= 4 ? '#ef4444' : heat > 0 ? '#f97316' : (hasOverdue ? PLAN_COLORS.overdue : 'rgba(233,235,232,.8)');
          return `<div style="background:var(--surface);border-radius:18px;padding:24px 26px;
                      border:2px solid ${burnBorder};border-left:7px solid ${gColor};
                      box-shadow:0 4px 15px rgba(0,0,0,.01);display:flex;flex-direction:column;gap:14px;
                      flex:1 1 ${basis || cardBasis};min-width:280px">
            <div style="display:flex;align-items:center;gap:10px;flex-shrink:0">
              <span style="flex-shrink:1;min-width:0;font-size:16px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:${gColor};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${planEscape(t._goalTitle || '')}</span>
              ${heat ? `<span style="flex-shrink:0;font-size:18px;letter-spacing:-2px">${'🔥'.repeat(heat)}</span>` : ''}
              <span style="margin-left:auto;font-weight:900;font-size:23px;color:${color};font-variant-numeric:tabular-nums;flex-shrink:0">${t.doneSteps}/${t.totalSteps}</span>
              <span style="color:${color};font-weight:900;font-size:29px;flex-shrink:0;text-decoration:underline;text-underline-offset:4px">${planDateDow(t.deadline)}</span>
            </div>
            <div style="font-weight:800;font-size:27px;line-height:1.35;color:var(--text-main)">${planEscape(t.title)}</div>
            ${peopleRow.length ? `<div style="display:flex;flex-wrap:wrap;gap:10px;align-items:center">${peopleRow.map(x => planAvatar(x.person, 64, x.ring)).join('')}</div>` : ''}
            <div style="border-top:1px solid rgba(233,235,232,.8);padding-top:8px">${stepsHtml}</div>
          </div>`;
        };
        const shownAny = flatTacts.length > 0;

        // Недельные периоды — плоская сетка карточек (как было). Прочие периоды
        // (месяц / «Все время») — чёткая иерархия: Цель → Задачи → подзадачи.
        const isWeekPeriod = ['week', 'week2', 'lastWeek'].includes(period);
        let planBody;
        if (!shownAny) {
          planBody = `<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:14px">Нет задач с крайним сроком в выбранном периоде</div>`;
        } else if (isWeekPeriod) {
          // В недельном виде не показываем задачи с полностью выполненным чек-листом.
          const weekTacts = flatTacts.filter(t => !(t.totalSteps > 0 && t.doneSteps === t.totalSteps));
          // При >10 карточках прячем выполненные пункты внутри карточек (чище/крупнее).
          planHideDoneSteps = weekTacts.length > 10;
          planBody = weekTacts.length
            ? `<div style="display:flex;flex-wrap:wrap;gap:14px;align-items:stretch;padding-bottom:16px">${weekTacts.map(t => renderTactCard(t)).join('')}</div>`
            : `<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:14px">Все задачи периода выполнены 🎉</div>`;
        } else {
          // Большой период — только ОБЗОР выполнения целей: без списка задач.
          // Карточка цели: название, % выполнения, шкала, счётчики.
          const goalCards = shownGoals
            .slice()
            .sort((a, b) => (a.num || 0) - (b.num || 0))
            .map(g => {
              const gColor = goalColor(g.num);
              const gp = pct(g.doneSteps, g.totalSteps);
              const barColor = gp >= 67 ? PLAN_COLORS.done
                             : gp >= 34 ? PLAN_COLORS.soon
                             : gp > 0   ? PLAN_COLORS.overdue
                             : '#c3c7cc';
              return `<div style="display:flex;flex-direction:column;gap:6px;border:1px solid rgba(233,235,232,.9);border-top:3px solid ${gColor};border-radius:9px;background:var(--surface);padding:9px 11px;box-shadow:0 2px 8px rgba(0,0,0,.02)">
                <div style="font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.2px;color:${gColor};line-height:1.2;min-height:24px">${planEscape(g.title)}</div>
                <div style="display:flex;align-items:baseline;gap:6px">
                  <span style="font-size:17px;font-weight:900;color:${barColor};line-height:1">${gp}%</span>
                  <span style="font-size:9.5px;font-weight:700;color:var(--text-muted)">${g.doneSteps}/${g.totalSteps} шагов</span>
                </div>
                <div style="height:5px;background:#eef0ed;border-radius:3px;overflow:hidden"><div style="height:100%;width:${gp}%;background:${barColor};border-radius:3px"></div></div>
                <div style="display:flex;flex-wrap:wrap;gap:2px 9px;font-size:9.5px;font-weight:700">
                  <span style="color:var(--text-muted)">${g.tacts.length} задач</span>
                  ${g.overdueSteps ? `<span style="color:${PLAN_COLORS.overdue}">${g.overdueSteps} просроч.</span>` : ''}
                  ${g.soonSteps ? `<span style="color:${PLAN_COLORS.soon}">${g.soonSteps} горит</span>` : ''}
                </div>
              </div>`;
            }).join('');
          planBody = `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(185px,1fr));gap:9px;align-items:start;padding-bottom:16px">${goalCards}</div>`;
        }

        const updAt = j.fetchedAt ? new Date(j.fetchedAt).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' }) : '';

        // ── «Обратите внимание»: people responsible for tasks with overdue or
        // soon-due (≤14 дн) steps, most-overdue first, with big avatars for TV.
        const attentionMap = new Map();
        goals.forEach(g => g.tacts.forEach(t => {
          if (!t.responsible || (t.overdueSteps === 0 && t.soonSteps === 0)) return;
          const key = t.responsible.id || t.responsible.name;
          if (!attentionMap.has(key)) attentionMap.set(key, { person: t.responsible, overdue: 0, soon: 0 });
          const a = attentionMap.get(key);
          a.overdue += t.overdueSteps;
          a.soon += t.soonSteps;
        }));
        const attention = [...attentionMap.values()].sort((a, b) => b.overdue - a.overdue || b.soon - a.soon);

        // ── «Люди 2 недель»: everyone involved in the shown period (responsible
        // or observer of any shown task), unique, as avatars.
        const peopleMap = new Map();
        goals.forEach(g => g.tacts.forEach(t => {
          [t.responsible, ...(t.observers || [])].forEach(p => {
            if (p && p.id && !peopleMap.has(p.id)) peopleMap.set(p.id, p);
          });
        }));
        const periodPeople = [...peopleMap.values()].sort((a, b) => a.name.localeCompare(b.name, 'ru'));
        const periodName = (document.getElementById('periodBtnLabel')?.textContent || '').trim();
        const peopleHtml = periodPeople.length ? `
          <section style="margin:8px 0 10px;padding:8px 16px 12px">
            <div style="display:flex;flex-wrap:wrap;gap:10px 16px;justify-content:center">
              ${periodPeople.map(p => `<span style="display:flex;flex-direction:column;align-items:center;gap:5px;width:64px">${planAvatar(p, 46, '#2563eb')}<span style="font-size:11px;font-weight:700;color:var(--text-main);text-align:center;line-height:1.2">${firstNameOnly(p.name)}</span></span>`).join('')}
            </div>
          </section>` : '';

        const attentionHtml = attention.length ? `
          <section style="margin:6px 0 18px;padding:12px 16px;background:#fff6f5;border:1px solid #f6c9c4;border-radius:14px">
            <div style="font-size:12px;font-weight:900;letter-spacing:.4px;color:#c0392b;margin-bottom:10px;text-align:center">⚠️ ОБРАТИТЕ ВНИМАНИЕ</div>
            <div style="display:flex;flex-wrap:wrap;gap:8px;justify-content:center">
              ${attention.map(a => `
                <div style="display:flex;align-items:center;gap:10px;background:#fff;border:1px solid #f0d2ce;border-radius:12px;padding:8px 14px 8px 8px;min-width:190px">
                  ${planAvatar(a.person, 38, a.overdue ? '#ef4444' : '#f97316')}
                  <div style="min-width:0">
                    <div style="font-weight:800;font-size:13px;color:var(--text-main);line-height:1.25">${firstNameOnly(a.person.name)}</div>
                    <div style="font-size:11px;font-weight:800;margin-top:2px">
                      ${a.overdue ? `<span style="color:#ef4444">просрочено</span>` : ''}${a.overdue && a.soon ? ' · ' : ''}${a.soon ? `<span style="color:#f97316">горит</span>` : ''}
                    </div>
                  </div>
                </div>`).join('')}
            </div>
          </section>` : '';

        ids.planWrap.innerHTML = `
          <div id="planScaler" style="transform-origin:top left">
          <div style="padding:6px 0 12px;position:relative;text-align:center">
            <div style="font-weight:900;font-size:30px;color:var(--text-main);line-height:1.2">Оперативный план IC Group 2026</div>
            <span style="position:absolute;top:6px;right:0;font-size:13px;color:var(--text-muted)">обновлено ${updAt}
              <button id="planRefresh" style="margin-left:8px;background:none;border:1px solid rgba(233,235,232,.9);
                      border-radius:8px;padding:3px 9px;cursor:pointer;font-size:11px;color:var(--text-muted)">↻</button>
            </span>
          </div>

          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">${metrics}</div>

          ${planBody}
          </div>`;

        const btn = document.getElementById('planRefresh');
        if (btn) btn.addEventListener('click', () => { planState.data = null; renderPlan(); });
        bindPlanToggle();

        // Kiosk fit: scale the whole plan down so it always fits one screen —
        // no scrolling or clicking needed (unusable with a TV remote).
        fitPlanToScreen();
      }

      let planFitBound = false;
      function fitPlanToScreen() {
        const scaler = document.getElementById('planScaler');
        if (!scaler) return;
        scaler.style.transform = '';
        scaler.style.width = '';
        // Excel-вид не подгоняем под экран — это большая таблица с прокруткой.
        if (planState.excel) {
          const p0 = scaler.parentElement;
          if (p0) { p0.style.height = ''; p0.style.overflow = ''; }
          return;
        }
        // На больших периодах план не влезает в один экран читабельно — не сжимаем,
        // даём обычную вертикальную прокрутку. Kiosk-fit только для недельных.
        const weekly = ['week', 'week2', 'lastWeek'].includes(state.period || 'all');
        if (!weekly) {
          const parent0 = scaler.parentElement;
          if (parent0) { parent0.style.height = ''; parent0.style.overflow = ''; }
          if (!planFitBound) {
            planFitBound = true;
            let rt0;
            window.addEventListener('resize', () => {
              clearTimeout(rt0);
              rt0 = setTimeout(() => { if (state.viewMode === 'table6') fitPlanToScreen(); }, 150);
            });
          }
          return;
        }
        // Defer so layout is settled (images/fonts) before measuring.
        setTimeout(() => {
          const s2 = document.getElementById('planScaler');
          if (!s2) return;
          const parent = s2.parentElement;
          const top = s2.getBoundingClientRect().top;
          const avail = window.innerHeight - top - 60;
          if (s2.scrollHeight <= 0) return;
          const clamp = v => Math.max(0.3, Math.min(1.8, v));
          // Width and height are coupled (wider box → less wrapping → shorter),
          // so iterate a few times until the scale settles.
          let scale = clamp(avail / s2.scrollHeight);
          for (let i = 0; i < 5; i++) {
            s2.style.width = (100 / scale) + '%';
            scale = clamp(avail / s2.scrollHeight);
          }
          // Lock width, then derive the final scale + height from the SAME
          // measurement so the box height matches exactly (no clipping, no gap).
          s2.style.width = (100 / scale) + '%';
          const contentH = s2.scrollHeight;
          const finalScale = clamp(avail / contentH);
          s2.style.transformOrigin = 'top left';
          s2.style.transform = `scale(${finalScale})`;
          parent.style.height = Math.ceil(contentH * finalScale) + 'px';
          parent.style.overflow = 'hidden';
        }, 50);
        if (!planFitBound) {
          planFitBound = true;
          let rt;
          window.addEventListener('resize', () => {
            clearTimeout(rt);
            rt = setTimeout(() => { if (state.viewMode === 'table6') fitPlanToScreen(); }, 150);
          });
        }
      }

      function renderStructureDashboard() {
        ids.aiAnalysisWrap.hidden = true;
        ids.galleryWrap.hidden = true;
        ids.zrsWrap.hidden = true;
        ids.tableWrap.hidden = true;
        if (ids.planWrap) ids.planWrap.hidden = true;
        if (ids.planTasksWrap) ids.planTasksWrap.hidden = true;
        ids.structureWrap.hidden = false;

        const depById = new Map((state.departments || []).map(d => [String(d.ID), d]));
        const depByName = new Map((state.departments || []).map(d => [String(d.NAME), d]));
        const rootNames = new Set(
          (state.departments || [])
            .filter(d => String(d.PARENT) === '157')
            .map(d => String(d.NAME))
        );
        const rootFor = name => {
          let dept = depByName.get(String(name || ''));
          const visited = new Set();
          while (dept && !visited.has(String(dept.ID))) {
            if (rootNames.has(String(dept.NAME))) return String(dept.NAME);
            visited.add(String(dept.ID));
            dept = depById.get(String(dept.PARENT || ''));
          }
          return 'Без отдела';
        };

        const groups = new Map();
        // Keep every staffed top-level department visible even when the selected
        // period contains no tasks for it.
        (state.allEmployees || []).forEach(emp => {
          if (!emp || !emp.name || isExcludedPerson(emp.name)) return;
          const deptName = remapDept(emp.name, rootFor(emp.dept));
          if (deptName === 'Без отдела') return;
          if (!groups.has(deptName)) {
            groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
          }
          const group = groups.get(deptName);
          if (!group.people.has(emp.name)) {
            group.people.set(emp.name, {
              name: emp.name,
              id: String(emp.id || ''),
              avatar: emp.avatar || '',
              rows: [],
              helping: new Map(),
              checklist: new Map(),
              overdueDays: 0,
              overdueTasks: 0
            });
          }
        });
        state.filteredRows.forEach(row => {
          const person = row['Исполнитель'] || '';
          if (!person || isExcludedPerson(person)) return;
          const deptName = remapDept(person, rootFor(row['Отдел']));
          if (!groups.has(deptName)) {
            groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
          }
          const group = groups.get(deptName);
          group.rows.push(row);
          if (!group.people.has(person)) {
            group.people.set(person, {
              name: person,
              id: String(row['ID исполнителя'] || ''),
              avatar: row['Аватар'] || '',
              rows: [],
              helping: new Map(),
              checklist: new Map(),
              overdueDays: 0,
              overdueTasks: 0
            });
          }
          const emp = group.people.get(person);
          emp.rows.push(row);
        });

        // Add tasks where the employee participates without being the main
        // executor. One task is shown once even if the person has both roles.
        state.filteredRows.forEach((row, rowIndex) => {
          const executorId = String(row['ID исполнителя'] || '');
          const executorName = String(row['Исполнитель'] || '');
          const helpers = new Map();
          const addHelpers = (field, role) => {
            parsePeopleField(row[field]).forEach(person => {
              const id = String(person.id || '');
              const name = String(person.name || '');
              if (!name || (id && id === executorId) || name === executorName || isExcludedPerson(name)) return;
              const key = id || name;
              if (!helpers.has(key)) helpers.set(key, { ...person, roles: new Set() });
              helpers.get(key).roles.add(role);
            });
          };
          addHelpers('Соисполнители', 'Соисполнитель');
          addHelpers('Наблюдатели', 'Наблюдатель');

          helpers.forEach(person => {
            const deptName = remapDept(person.name, rootFor(person.dept));
            if (deptName === 'Без отдела') return;
            if (!groups.has(deptName)) {
              groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
            }
            const group = groups.get(deptName);
            if (!group.people.has(person.name)) {
              group.people.set(person.name, {
                name: person.name,
                id: String(person.id || ''),
                avatar: person.avatar || '',
                rows: [],
                helping: new Map(),
                checklist: new Map(),
                overdueDays: 0,
                overdueTasks: 0
              });
            }
            const emp = group.people.get(person.name);
            if (!emp.helping) emp.helping = new Map();
            const taskKey = String(row['ID задачи'] || rowIndex);
            emp.helping.set(taskKey, { row, roles: Array.from(person.roles) });
          });
        });

        // Count project-51 checklist items separately from their parent tasks.
        // Each executor or observer assigned to an item receives one checklist unit.
        const employeeById = new Map(
          (state.allEmployees || []).map(employee => [String(employee.id || ''), employee])
        );
        state.filteredRows.forEach(row => {
          let items = [];
          try {
            items = JSON.parse(row['Чек-лист'] || '[]');
          } catch {}
          if (!Array.isArray(items)) return;
          const taskId = String(row['ID задачи'] || '');
          const taskTitle = String(row['Название задачи'] || 'Без названия');
          items.forEach(item => {
            const itemOverdue = isChecklistItemOverdue(item);
            const itemDeadline = checklistItemDeadline(item.title);
            (item.members || []).forEach(member => {
              const memberId = String(member.id || '');
              const employee = employeeById.get(memberId);
              if (!employee || isExcludedPerson(employee.name)) return;
              const deptName = remapDept(employee.name, rootFor(employee.dept));
              if (deptName === 'Без отдела') return;
              if (!groups.has(deptName)) {
                groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
              }
              const group = groups.get(deptName);
              if (!group.people.has(employee.name)) {
                group.people.set(employee.name, {
                  name: employee.name,
                  id: memberId,
                  avatar: employee.avatar || '',
                  rows: [],
                  helping: new Map(),
                  checklist: new Map(),
                  overdueDays: 0,
                  overdueTasks: 0
                });
              }
              const person = group.people.get(employee.name);
              if (!person.checklist) person.checklist = new Map();
              person.checklist.set(`${taskId}:${item.id}`, {
                complete: item.complete === true,
                overdue: itemOverdue,
                title: String(item.title || ''),
                deadline: itemDeadline,
                projectId: String(row['ID проекта'] || ''),
                taskId,
                taskTitle
              });
            });
          });
        });

        const depts = Array.from(groups.values())
          .filter(d => d.name !== 'Без отдела')
          .sort((a, b) => b.rows.length - a.rows.length);
        if (!depts.length) {
          ids.structureWrap.innerHTML = '<div class="loading-panel">Нет данных для структуры</div>';
          renderStats(state.filteredRows);
          return;
        }

        const maxOverdue = Math.max(...depts.map(d => d.overdueCount), 1);
        const taskQuality = row => {
          const status = String(row['Состояние задачи'] || '');
          const days = Math.max(0, parseInt(row['Просрочка, дней']) || 0);
          if (status === 'Закрыта в срок' || status === 'Открыта в срок') return 100;
          if (status === 'Закрыта с просрочкой') return Math.max(50, 100 - Math.min(days, 25) * 2);
          if (status === 'Открыта просрочена') return Math.max(0, 70 - Math.min(days, 14) * 5);
          if (status === 'Без дедлайна') return 75;
          return 75;
        };
        const scoreForRows = rows => {
          if (!rows.length) return null;
          const executionQuality = rows.reduce((sum, row) => sum + taskQuality(row), 0) / rows.length;
          const currentOverdue = rows.filter(row => row['Состояние задачи'] === 'Открыта просрочена');
          const currentOverdueDays = currentOverdue.reduce(
            (sum, row) => sum + Math.max(0, parseInt(row['Просрочка, дней']) || 0),
            0
          );
          const currentDiscipline = Math.max(0, 100 - currentOverdue.length * 20 - currentOverdueDays * 2);
          return Math.round(executionQuality * .7 + currentDiscipline * .3);
        };
        // «Оценка: все» — доля выполненного среди всех единиц работы: задачи
        // (по статусу «Закрыта») ПЛЮС пункты чек-листов ОП 2026 (каждый пункт —
        // отдельная единица). Чек-листы важны, поэтому считаем их наравне с задачами.
        const closedTasks = rows => rows.filter(row => String(row['Состояние задачи'] || '').startsWith('Закрыта')).length;
        const completionUnits = rows => {
          const steps = planStepsOf(rows);
          return { done: closedTasks(rows) + steps.filter(Boolean).length, total: rows.length + steps.length };
        };
        const completionOf = rows => {
          const u = completionUnits(rows);
          return u.total ? Math.round(u.done / u.total * 100) : 0;
        };
        // Период фильтрует пункты чек-листа по ИХ СОБСТВЕННОЙ дате «до …», а не по
        // дедлайну задачи (он = дата последнего пункта). Так «на этой неделе»
        // считает именно пункты со сроком на этой неделе. null = «Все время».
        const periodRange = getPeriodRange(state.period);
        const stepInRange = item => {
          if (!periodRange) return true;
          const dl = checklistItemDeadline(item.title);
          return !!dl && dl >= periodRange.start && dl <= periodRange.end;
        };
        // «Оценка: план» — прогресс по чек-листам задач ОП 2026 (проект 51). У этих
        // пунктов пустые MEMBERS, поэтому по людям их не разложить — считаем по
        // задачам исполнителя/отдела, читая чек-лист прямо из строки задачи.
        const planStepsOf = rowsList => {
          const m = new Map();
          rowsList.forEach(row => {
            if (String(row['ID проекта'] || '') !== OP_GROUP_ID) return;
            let items = [];
            try { items = JSON.parse(row['Чек-лист'] || '[]'); } catch {}
            const tid = String(row['ID задачи'] || '');
            items.forEach(it => { if (stepInRange(it)) m.set(`${tid}:${it.id}`, it.complete === true); });
          });
          return Array.from(m.values());
        };
        const planPctOf = rowsList => {
          const steps = planStepsOf(rowsList);
          return steps.length ? Math.round(steps.filter(Boolean).length / steps.length * 100) : 0;
        };
        // Просрочка задачи. Для план-задач (проект 51) срок ВСЕГДА по чек-листу:
        // задача просрочена, если есть невыполненный пункт с прошедшей датой;
        // дней = по самому давнему такому пункту. Для остальных — по статусу задачи.
        const nowMs = Date.now();
        const rowOverdue = row => {
          if (String(row['ID проекта'] || '') === OP_GROUP_ID) {
            if (String(row['Состояние задачи'] || '').startsWith('Закрыта')) return { overdue: false, count: 0, days: 0, date: null };
            let items = [];
            try { items = JSON.parse(row['Чек-лист'] || '[]'); } catch {}
            let worst = 0, count = 0, worstDl = null;
            (Array.isArray(items) ? items : []).forEach(it => {
              if (it.complete === true || !stepInRange(it)) return;
              const dl = checklistItemDeadline(it.title);
              if (dl && dl.getTime() < nowMs) {
                count++; // каждый просроченный пункт чек-листа — единица просрочки
                const days = Math.floor((nowMs - dl.getTime()) / 864e5);
                if (days > worst) { worst = days; worstDl = dl; }
              }
            });
            return { overdue: count > 0, count, days: worst, date: worstDl };
          }
          if (String(row['Состояние задачи'] || '') === 'Открыта просрочена') {
            return { overdue: true, count: 1, days: Math.max(0, parseInt(row['Просрочка, дней']) || 0), date: null };
          }
          return { overdue: false, count: 0, days: 0, date: null };
        };
        const rosterByDept = new Map();
        (state.allEmployees || []).forEach(emp => {
          if (!emp || !emp.name || isExcludedPerson(emp.name)) return;
          const deptName = remapDept(emp.name, rootFor(emp.dept));
          if (deptName === 'Без отдела') return;
          if (!rosterByDept.has(deptName)) rosterByDept.set(deptName, new Set());
          rosterByDept.get(deptName).add(String(emp.id || emp.name));
        });
        depts.forEach(d => {
          d.score = completionOf(d.rows);
          d.planScore = planPctOf(d.rows);
          d.employeeCount = rosterByDept.get(d.name)?.size || d.people.size;
          // Нагрузка = единицы работы: задачи (исполнитель) + участие («Помогает»)
          // + пункты чек-листов ОП 2026 (в периоде). helping дедуплен и не
          // пересекается с собственными задачами — двойного счёта нет.
          const helpingTotal = Array.from(d.people.values())
            .reduce((sum, e) => sum + (e.helping ? e.helping.size : 0), 0);
          const deptStepCount = planStepsOf(d.rows).length;
          d.loadCount = d.rows.length + helpingTotal + deptStepCount;
          d.workloadRatio = d.employeeCount ? d.loadCount / d.employeeCount : 0;
          d.people.forEach(e => {
            e.score = completionOf(e.rows);
            // «План» учитывает чек-листы всех план-задач, где человек участвует —
            // как исполнитель, ТАК и наблюдатель/соисполнитель (он реально
            // закрывает пункты). planPctOf дедупит пункты по задаче.
            const helpRows = Array.from((e.helping || new Map()).values()).map(h => h.row);
            e.planScore = planPctOf([...e.rows, ...helpRows]);
          });
          // Overdue is counted for BOTH executed and participated tasks (наблюдатель/
          // соисполнитель) — same basis as «Нагрузка». Dedup per person and per
          // department by task id, so one task never inflates a единицу дважды.
          const collectOverdue = rowsList => {
            const m = new Map();
            rowsList.forEach(row => {
              const info = rowOverdue(row);
              if (!info.overdue) return;
              const key = String(row['ID задачи'] || '') || row['Название задачи'] || Math.random();
              if (!m.has(key)) m.set(key, { row, days: info.days, count: info.count });
            });
            return m;
          };
          d.people.forEach(e => {
            const helpRows = Array.from((e.helping || new Map()).values()).map(h => h.row);
            const m = collectOverdue([...e.rows, ...helpRows]);
            e.overdueTasks = m.size;
            // «Просрочка» = количество просроченных пунктов чек-листа (обычная
            // просроченная задача считается как 1).
            e.overdueCount = Array.from(m.values()).reduce((s, x) => s + x.count, 0);
            e.overdueDays = Array.from(m.values()).reduce((s, x) => s + x.days, 0);
          });
          const helpRowsAll = Array.from(d.people.values())
            .flatMap(e => Array.from((e.helping || new Map()).values()).map(h => h.row));
          const deptOverdue = collectOverdue([...d.rows, ...helpRowsAll]);
          d.overdueRows = Array.from(deptOverdue.values())
            .sort((a, b) => b.count - a.count || b.days - a.days)
            .map(x => x.row);
          d.overdueTasks = deptOverdue.size;
          d.overdueCount = Array.from(deptOverdue.values()).reduce((s, x) => s + x.count, 0);
          d.overdueDays = Array.from(deptOverdue.values()).reduce((s, x) => s + x.days, 0);
        });
        const ratioDepts = depts.filter(d => d.employeeCount > 0);
        const tbu = ratioDepts.length
          ? ratioDepts.reduce((sum, d) => sum + d.workloadRatio, 0) / ratioDepts.length
          : 0;
        const shortDeptName = name => ({
          'Административное управление': 'Адм. управление',
          'Финансовое управление': 'Фин. управление',
          'Без отдела': 'Без отд.',
          'Офис учредителя': 'Офис'
        }[name] || name);
        const chartDeptLines = name => {
          const shortName = shortDeptName(name);
          if (shortName === 'Адм. управление') return ['Адм.', 'управление'];
          if (shortName === 'Фин. управление') return ['Фин.', 'управление'];
          // Wrap any remaining multi-word name onto two balanced lines so long
          // captions (e.g. «Коммерческое управление», «Управление PR») do not
          // collide with their neighbours on the axis.
          const words = shortName.split(/\s+/).filter(Boolean);
          if (words.length <= 1) return [shortName];
          let splitAt = 1;
          let bestDiff = Infinity;
          for (let i = 1; i < words.length; i++) {
            const left = words.slice(0, i).join(' ').length;
            const right = words.slice(i).join(' ').length;
            const diff = Math.abs(left - right);
            if (diff < bestDiff) { bestDiff = diff; splitAt = i; }
          }
          return [words.slice(0, splitAt).join(' '), words.slice(splitAt).join(' ')];
        };
        const deptOrder = [
          'Административное управление',
          'Финансовое управление',
          'УК',
          'Аутсорсинг',
          'УРК',
          'Без отдела',
          'Офис учредителя'
        ];
        const ratioSorted = ratioDepts.slice().sort((a, b) => {
          const ai = deptOrder.indexOf(a.name);
          const bi = deptOrder.indexOf(b.name);
          return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        });
        const chartMax = Math.max(1, Math.ceil(Math.max(tbu, ...ratioSorted.map(d => d.workloadRatio)) * 1.2));
        const chartLeft = 70;
        const chartRight = 930;
        const chartTop = 20;
        const chartBottom = 145;
        const chartWidth = chartRight - chartLeft;
        const chartHeight = chartBottom - chartTop;
        const xFor = index => ratioSorted.length === 1
          ? (chartLeft + chartRight) / 2
          : chartLeft + index * chartWidth / (ratioSorted.length - 1);
        const yFor = value => chartBottom - value / chartMax * chartHeight;
        const gridValues = [0, chartMax / 2, chartMax];
        const ratioGrid = gridValues.map(value => {
          const y = yFor(value);
          return `<line x1="${chartLeft}" y1="${y.toFixed(1)}" x2="${chartRight}" y2="${y.toFixed(1)}" stroke="#dfe3de" stroke-width="1"/>
            <text x="${chartLeft - 18}" y="${(y + 4).toFixed(1)}" text-anchor="end" fill="#7c837c" font-size="12">${value.toFixed(1)}</text>`;
        }).join('');
        const ratioPath = ratioSorted.map((d, index) => `${xFor(index).toFixed(1)},${yFor(d.workloadRatio).toFixed(1)}`).join(' ');
        // Soft area under the load line for readability.
        const ratioArea = ratioSorted.length
          ? `<polygon points="${xFor(0).toFixed(1)},${chartBottom} ${ratioPath} ${xFor(ratioSorted.length - 1).toFixed(1)},${chartBottom}" fill="#317fd4" opacity="0.08"/>`
          : '';
        const ratioPoints = ratioSorted.map((d, index) => {
          const x = xFor(index);
          const y = yFor(d.workloadRatio);
          // Point colour flags the department vs ТБУ: red = above the norm
          // (overloaded), blue = at or below.
          const over = d.workloadRatio > tbu;
          const dot = over ? '#e54c50' : '#317fd4';
          const valColor = over ? '#c0453f' : '#243024';
          const labelLines = chartDeptLines(d.name);
          const label = labelLines.map((line, lineIndex) =>
            `<tspan x="${x.toFixed(1)}" dy="${lineIndex ? 14 : 0}">${escapeHtml(line)}</tspan>`
          ).join('');
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="7" fill="${dot}" stroke="#ffffff" stroke-width="2"/>
            <text x="${x.toFixed(1)}" y="${(y - 13).toFixed(1)}" text-anchor="middle" fill="${valColor}" font-size="14" font-weight="700">${d.workloadRatio.toFixed(1)}</text>
            <text x="${x.toFixed(1)}" y="${chartBottom + 22}" text-anchor="middle" fill="#354035" font-size="11.5" font-weight="600">${label}</text>`;
        }).join('');
        const tbuY = yFor(tbu);
        const ratioDiagram = `<svg class="sd-ratio-svg" viewBox="0 0 1000 215" role="img" aria-label="Диаграмма нагрузки по отделам и средняя линия ТБУ">
          ${ratioGrid}
          ${ratioArea}
          <line x1="${chartLeft}" y1="${chartBottom}" x2="${chartRight}" y2="${chartBottom}" stroke="#aeb5ae" stroke-width="1.5"/>
          <line x1="${chartLeft}" y1="${tbuY.toFixed(1)}" x2="${chartRight}" y2="${tbuY.toFixed(1)}" stroke="#e54c50" stroke-width="2" stroke-dasharray="8 7"/>
          <text x="${chartRight}" y="${(tbuY - 6).toFixed(1)}" text-anchor="end" fill="#e54c50" font-size="11" font-weight="700">ТБУ ${tbu.toFixed(1)}</text>
          <polyline points="${ratioPath}" fill="none" stroke="#317fd4" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
          ${ratioPoints}
        </svg>`;
        // Per-person load = executor + participation («Помогает»), same basis as
        // the department workload above.
        const personLoad = emp => emp.rows.length + (emp.helping ? emp.helping.size : 0) + planStepsOf(emp.rows).length;
        const lowLoadPeople = depts.flatMap(d => {
          const threshold = Math.max(1, d.workloadRatio * .4);
          return Array.from(d.people.values())
            .filter(emp => personLoad(emp) < threshold)
            .map(emp => ({ ...emp, load: personLoad(emp), deptName: d.name, deptRatio: d.workloadRatio }));
        }).sort((a, b) =>
          a.load - b.load ||
          b.deptRatio - a.deptRatio ||
          a.name.localeCompare(b.name, 'ru')
        );
        const highLoadPeople = depts.flatMap(d =>
          Array.from(d.people.values())
            .filter(emp => personLoad(emp) > tbu)
            .map(emp => ({ ...emp, load: personLoad(emp), deptName: d.name, deptRatio: d.workloadRatio }))
        ).sort((a, b) => b.load - a.load || a.name.localeCompare(b.name, 'ru'));
        const loadAvatar = emp => {
          const initials = escapeHtml(getInitials(emp.name));
          const fallback = `<span style="background:${avatarColor(emp.id || emp.name)}">${initials}</span>`;
          if (!emp.avatar) return `<span class="sd-load-avatar">${fallback}</span>`;
          return `<span class="sd-load-avatar">${fallback}<img src="${escapeHtml(emp.avatar)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'"></span>`;
        };
        const renderLoadCards = (people, high = false) => people.length
          ? people.map(emp => `<div class="sd-lowload-card${high ? ' high' : ''}">
              ${loadAvatar(emp)}
              <span class="sd-lowload-name" title="${escapeHtml(emp.deptName)} · среднее ${emp.deptRatio.toFixed(1)}">${escapeHtml(emp.name)}</span>
              <span class="sd-lowload-count">${emp.load} зад.</span>
              <span class="sd-lowload-meta">${escapeHtml(emp.deptName)} · среднее ${emp.deptRatio.toFixed(1)}</span>
            </div>`).join('')
          : `<div class="sd-lowload-empty">${high ? 'Сотрудников выше ТБУ нет' : 'Сотрудников с очень низкой нагрузкой нет'}</div>`;
        const highLoadCards = renderLoadCards(highLoadPeople, true);
        const lowLoadCards = renderLoadCards(lowLoadPeople);

        const palette = ['#317fd4', '#92938c', '#5141aa', '#1eae79', '#f26a3d', '#7666c8', '#2c9db1'];
        // Объём работы = задачи + пункты чек-листов ОП 2026 (каждый пункт — единица).
        const deptUnits = d => d.rows.length + planStepsOf(d.rows).length;
        const totalUnits = depts.reduce((sum, d) => sum + deptUnits(d), 0);
        const stack = depts.map((d, index) => {
          const units = deptUnits(d);
          const steps = units - d.rows.length;
          const width = totalUnits ? units / totalUnits * 100 : 0;
          const pct = Math.round(width);
          // Thin segments only keep the count — the name would just clip; the
          // full name and share stay in the hover tooltip.
          const roomy = width >= 6;
          return `<div class="sd-stack-item" style="width:${width.toFixed(2)}%;background:${palette[index % palette.length]}" title="${escapeHtml(d.name)} · ${units} ед. (${d.rows.length} задач + ${steps} пунктов) · ${pct}%">
            <span class="sd-stack-value">${units}<span class="sd-stack-pct">${pct}%</span></span>
            ${roomy ? `<span class="sd-stack-label">${escapeHtml(shortDeptName(d.name))}</span>` : ''}
          </div>`;
        }).join('');

        // Render a task's checklist steps as bullets under its title (used in the
        // «Просрочка» и «Выполнено» lists). Strips the old «· до …/· исполнитель:»
        // suffixes from step titles.
        const cleanStepTitle = t => String(t || '')
          .replace(/\s*·\s*исполнитель\s*:.*$/i, '')
          .replace(/\s*·\s*до\s+\d{1,2}\.\d{1,2}\.\d{4}\s*/i, ' ')
          .replace(/^\s*\d+(?:\.\d+)*\s+/, '')
          .trim();
        const fmtDate = dt => `${String(dt.getDate()).padStart(2, '0')}.${String(dt.getMonth() + 1).padStart(2, '0')}.${dt.getFullYear()}`;
        const taskChecklistBullets = (row, only) => {
          let items = [];
          try { items = JSON.parse(row['Чек-лист'] || '[]'); } catch {}
          // Показываем только пункты со сроком в выбранном периоде («Все время» — все).
          items = (Array.isArray(items) ? items : []).filter(stepInRange);
          // only==='overdue' — в блоке «Просрочка» показываем ТОЛЬКО просроченные пункты.
          if (only === 'overdue') {
            items = items.filter(it => {
              if (it.complete === true) return false;
              const dl = checklistItemDeadline(it.title);
              return dl && dl.getTime() < Date.now();
            });
          }
          if (!items.length) return '';
          const lis = items.map(it => {
            const done = it.complete === true;
            const dl = checklistItemDeadline(it.title);
            // Overdue is judged by the checklist step's own «до …» date, not the
            // parent task — a step past its date and not done reads red.
            const overdue = !done && !!dl && dl.getTime() < Date.now();
            const cls = done ? ' done' : overdue ? ' overdue' : '';
            const dateHtml = dl ? `<span class="sd-cl-date">${fmtDate(dl)}</span>` : '';
            return `<li class="sd-cl-bullet${cls}"><span class="sd-cl-txt">${escapeHtml(cleanStepTitle(it.title) || 'Пункт чек-листа')}</span>${dateHtml}</li>`;
          }).join('');
          return `<ul class="sd-cl-bullets">${lis}</ul>`;
        };
        const taskRowHtml = (titleHtml, metaHtml, row, only) => {
          const exec = escapeHtml(String(row['Исполнитель'] || '').trim());
          return `<div class="sd-overdue-item"><div class="sd-overdue-task"><span class="sd-ov-title">${titleHtml}${exec ? `<span class="sd-ov-exec">${exec}</span>` : ''}</span><span>${metaHtml}</span></div>${taskChecklistBullets(row, only)}</div>`;
        };

        // A task counts as «выполнено» when it is closed OR still open but all of
        // its checklist items are ticked (чек-лист(ы) выполнены).
        const checklistAllDone = row => {
          let items = [];
          try { items = JSON.parse(row['Чек-лист'] || '[]'); } catch {}
          return Array.isArray(items) && items.length > 0 && items.every(it => it.complete === true);
        };
        const isDoneRow = row =>
          String(row['Состояние задачи'] || '').startsWith('Закрыта') || checklistAllDone(row);

        // Only departments that actually have overdue days appear in the
        // «Просрочка» block; the whole block is hidden when there are none.
        const overdueBarDepts = depts
          .slice()
          .filter(d => d.overdueCount > 0)
          .sort((a, b) => b.overdueCount - a.overdueCount);
        const bars = overdueBarDepts
          .map(d => {
            // Overdue tasks the department is exposed to — executed OR participated
            // in (наблюдатель/соисполнитель), deduped by task id above.
            const unfinished = d.overdueRows || [];
            const unfinishedRows = unfinished.length
              ? unfinished.map(row => {
                  const taskId = String(row['ID задачи'] || '');
                  const title = escapeHtml(row['Название задачи'] || 'Без названия');
                  const titleHtml = state.portalHost && /^\d+$/.test(taskId)
                    ? `<a class="task-link" target="_blank" href="https://${escapeHtml(state.portalHost)}/company/personal/user/0/tasks/task/view/${taskId}/">${title}</a>`
                    : title;
                  const info = rowOverdue(row);
                  // Для план-задач показываем срок ПО ЧЕК-ЛИСТУ (дата просроченного
                  // пункта), а не дедлайн всей задачи — иначе дата не бьётся с «дн.».
                  const dateStr = info.date ? fmtDate(info.date) : (row['Дедлайн'] || 'Без срока');
                  return taskRowHtml(titleHtml, `${escapeHtml(dateStr)}${info.count ? ` · ${info.count} просроч.` : ''}`, row, 'overdue');
                }).join('')
              : '<div class="sd-overdue-empty">Просроченных задач нет</div>';
            return `<details class="sd-overdue-dept">
              <summary class="sd-bar-row" title="Показать ${unfinished.length} просроченных задач">
                <span class="sd-bar-name" title="${escapeHtml(d.name)}">${escapeHtml(shortDeptName(d.name))}</span>
                <div class="sd-bar-track"><div class="sd-bar-fill" style="width:${(d.overdueCount / maxOverdue * 100).toFixed(1)}%"></div></div>
                <span class="sd-bar-value">${d.overdueCount}</span>
              </summary>
              <div class="sd-overdue-tasks">${unfinishedRows}</div>
            </details>`;
          }).join('');

        // «Выполнено» — completed tasks per department (mirror of «Просрочка»).
        const doneByDept = depts
          .map(d => ({ d, done: d.rows.filter(isDoneRow) }))
          .filter(x => x.done.length > 0)
          .sort((a, b) => b.done.length - a.done.length);
        const maxDone = Math.max(...doneByDept.map(x => x.done.length), 1);
        const doneBars = doneByDept.map(({ d, done }) => {
          const rows = done
            .slice()
            .sort((a, b) => String(b.closedDateRaw || '').localeCompare(String(a.closedDateRaw || '')))
            .map(row => {
              const taskId = String(row['ID задачи'] || '');
              const title = escapeHtml(row['Название задачи'] || 'Без названия');
              const titleHtml = state.portalHost && /^\d+$/.test(taskId)
                ? `<a class="task-link" target="_blank" href="https://${escapeHtml(state.portalHost)}/company/personal/user/0/tasks/task/view/${taskId}/">${title}</a>`
                : title;
              return taskRowHtml(titleHtml, escapeHtml(row['Дата закрытия'] || row['Дедлайн'] || ''), row);
            }).join('');
          return `<details class="sd-overdue-dept sd-done-dept">
              <summary class="sd-bar-row" title="Показать ${done.length} выполненных задач">
                <span class="sd-bar-name" title="${escapeHtml(d.name)}">${escapeHtml(shortDeptName(d.name))}</span>
                <div class="sd-bar-track"><div class="sd-bar-fill" style="width:${(done.length / maxDone * 100).toFixed(1)}%;background:linear-gradient(90deg,#4fce6b,#22a06b)"></div></div>
                <span class="sd-bar-value">${done.length}</span>
              </summary>
              <div class="sd-overdue-tasks">${rows}</div>
            </details>`;
        }).join('');

        const healthFor = d => {
          if (d.score === null) return ['Нет оценки', 'stable'];
          if (d.score >= 90) return ['Лидер', 'leader'];
          if (d.score >= 75) return ['Стабильно', 'stable'];
          if (d.score >= 60) return ['Перегруз', 'overload'];
          return ['Риск', 'risk'];
        };

        // Per-person task detail is shown in a popup; collect each person's task
        // HTML here and open it on row click (see the delegated handler below).
        state.personDetails = {};
        state.personChecklists = {};
        let personSeq = 0;
        const scoreHead = state.planFilter === 'plan' ? 'Оценка: по плану'
          : state.planFilter === 'off' ? 'Оценка: вне плана' : 'Оценка: все / по плану';
        const cards = depts.map((d, index) => {
          const [health, healthClass] = healthFor(d);
          const departmentHeadId = String(depByName.get(d.name)?.UF_HEAD || '');
          const people = Array.from(d.people.values()).sort((a, b) => {
            const aHead = departmentHeadId && String(a.id) === departmentHeadId ? 1 : 0;
            const bHead = departmentHeadId && String(b.id) === departmentHeadId ? 1 : 0;
            return bHead - aHead || (b.score ?? -1) - (a.score ?? -1) || a.name.localeCompare(b.name, 'ru');
          });
          const peopleRows = people.map(emp => {
            const isManager = departmentHeadId && String(emp.id) === departmentHeadId;
            const sortedRows = rows => rows.slice().sort((a, b) => {
              const aOverdue = a['Состояние задачи'] === 'Открыта просрочена' ? 0 : 1;
              const bOverdue = b['Состояние задачи'] === 'Открыта просрочена' ? 0 : 1;
              if (aOverdue !== bOverdue) return aOverdue - bOverdue;
              return String(a.deadlineRaw || '9999').localeCompare(String(b.deadlineRaw || '9999'));
            });
            const renderTaskRow = (row, roles = []) => {
              const taskId = String(row['ID задачи'] || '');
              const title = escapeHtml(row['Название задачи'] || 'Без названия');
              const titleHtml = state.portalHost && /^\d+$/.test(taskId)
                ? `<a class="task-link" target="_blank" href="https://${escapeHtml(state.portalHost)}/company/personal/user/0/tasks/task/view/${taskId}/">${title}</a>`
                : title;
              const status = String(row['Состояние задачи'] || 'Без статуса');
              const statusClass = status === 'Открыта просрочена'
                ? 'danger'
                : (status.startsWith('Закрыта') ? 'success' : '');
              // Прогресс по чек-листу задачи (важно для задач ОП 2026); считаем
              // и показываем только пункты со сроком в выбранном периоде.
              let clItems = [];
              try { clItems = JSON.parse(row['Чек-лист'] || '[]'); } catch {}
              clItems = (Array.isArray(clItems) ? clItems : []).filter(stepInRange);
              const clHtml = clItems.length
                ? `<div class="sd-task-cl"><span class="sd-task-cl-head">Чек-лист ${clItems.filter(i => i.complete === true).length}/${clItems.length}</span>${taskChecklistBullets(row)}</div>`
                : '';
              const exec = escapeHtml(String(row['Исполнитель'] || '').trim());
              return `<div class="sd-task">
                <div class="sd-task-title">${titleHtml}${exec ? `<span class="sd-ov-exec">${exec}</span>` : ''}${roles.length ? `<span class="sd-task-role">${escapeHtml(roles.join(' · '))}</span>` : ''}${clHtml}</div>
                <span class="sd-task-status ${statusClass}">${escapeHtml(status)}</span>
                <span class="sd-task-deadline">${escapeHtml(row['Дедлайн'] || 'Без срока')}</span>
              </div>`;
            };
            const helpingItems = Array.from((emp.helping || new Map()).values());
            const checklistItems = Array.from((emp.checklist || new Map()).values());
            const completedChecklistItems = checklistItems.filter(item => item.complete).length;
            const overdueChecklistItems = checklistItems.filter(item => item.overdue).length;
            const isPlanRow = row => String(row['ID проекта'] || '') === OP_GROUP_ID;
            const planTaskCount = emp.rows.filter(isPlanRow).length;
            const outsideTaskCount = emp.rows.length - planTaskCount;
            // «В рабочей группе» — наблюдатель/соисполнитель в проекте 51.
            // «Помогает» остаётся только для задач вне плана, чтобы не задваивать.
            const planGroupCount = helpingItems.filter(item => isPlanRow(item.row)).length;
            const offHelpingCount = helpingItems.length - planGroupCount;
            const renderTaskGroup = (title, ownRows, helpItems, outside = false) => {
              const ownTaskRows = sortedRows(ownRows).map(row => renderTaskRow(row)).join('');
              const helpingRows = sortedRows(helpItems.map(item => item.row)).map(row => {
                const item = helpItems.find(value => value.row === row);
                return renderTaskRow(row, item ? item.roles : []);
              }).join('');
              if (!ownTaskRows && !helpingRows) return '';
              const total = ownRows.length + helpItems.length;
              return `<div class="sd-task-plan-group${outside ? ' outside' : ''}">
                <div class="sd-task-plan-title${outside ? ' outside' : ''}">${title}<span class="sd-task-plan-count">${total}</span></div>
