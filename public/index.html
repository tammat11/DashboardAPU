                      border-radius:8px;padding:3px 9px;cursor:pointer;font-size:11px;color:var(--text-muted)">↻</button>
            </span>
          </div>

          <div style="display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px">${metrics}</div>

          ${shownGoals.length
            ? `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;padding-bottom:32px">${cards}</div>`
            : `<div style="text-align:center;padding:40px;color:var(--text-muted);font-size:13px">Нет задач с крайним сроком в выбранном периоде</div>`}`;

        const btn = document.getElementById('planRefresh');
        if (btn) btn.addEventListener('click', () => { planState.data = null; renderPlan(); });
      }

      function renderStructureDashboard() {
        ids.aiAnalysisWrap.hidden = true;
        ids.galleryWrap.hidden = true;
        ids.zrsWrap.hidden = true;
        ids.tableWrap.hidden = true;
        if (ids.planWrap) ids.planWrap.hidden = true;
        if (ids.planTasksWrap) ids.planTasksWrap.hidden = true;
        ids.structureWrap.hidden = false;

        const depById = new Map((state.departments || []).map(d => [String(d.ID), d]));
        const depByName = new Map((state.departments || []).map(d => [String(d.NAME), d]));
        const rootNames = new Set(
          (state.departments || [])
            .filter(d => String(d.PARENT) === '157')
            .map(d => String(d.NAME))
        );
        const rootFor = name => {
          let dept = depByName.get(String(name || ''));
          const visited = new Set();
          while (dept && !visited.has(String(dept.ID))) {
            if (rootNames.has(String(dept.NAME))) return String(dept.NAME);
            visited.add(String(dept.ID));
            dept = depById.get(String(dept.PARENT || ''));
          }
          return 'Без отдела';
        };

        const groups = new Map();
        // Keep every staffed top-level department visible even when the selected
        // period contains no tasks for it.
        (state.allEmployees || []).forEach(emp => {
          if (!emp || !emp.name || isExcludedPerson(emp.name)) return;
          const deptName = rootFor(emp.dept);
          if (deptName === 'Без отдела') return;
          if (!groups.has(deptName)) {
            groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
          }
          const group = groups.get(deptName);
          if (!group.people.has(emp.name)) {
            group.people.set(emp.name, {
              name: emp.name,
              id: String(emp.id || ''),
              avatar: emp.avatar || '',
              rows: [],
              helping: new Map(),
              overdueDays: 0,
              overdueTasks: 0
            });
          }
        });
        state.filteredRows.forEach(row => {
          const person = row['Исполнитель'] || '';
          if (!person || isExcludedPerson(person)) return;
          const deptName = rootFor(row['Отдел']);
          if (!groups.has(deptName)) {
            groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
          }
          const group = groups.get(deptName);
          const isOpenOverdue = row['Состояние задачи'] === 'Открыта просрочена';
          const overdue = isOpenOverdue ? Math.max(0, parseInt(row['Просрочка, дней']) || 0) : 0;
          group.rows.push(row);
          group.overdueDays += overdue;
          if (isOpenOverdue) group.overdueTasks++;
          if (!group.people.has(person)) {
            group.people.set(person, {
              name: person,
              id: String(row['ID исполнителя'] || ''),
              avatar: row['Аватар'] || '',
              rows: [],
              helping: new Map(),
              overdueDays: 0,
              overdueTasks: 0
            });
          }
          const emp = group.people.get(person);
          emp.rows.push(row);
          emp.overdueDays += overdue;
          if (isOpenOverdue) emp.overdueTasks++;
        });

        // Add tasks where the employee participates without being the main
        // executor. One task is shown once even if the person has both roles.
        state.filteredRows.forEach((row, rowIndex) => {
          const executorId = String(row['ID исполнителя'] || '');
          const executorName = String(row['Исполнитель'] || '');
          const helpers = new Map();
          const addHelpers = (field, role) => {
            parsePeopleField(row[field]).forEach(person => {
              const id = String(person.id || '');
              const name = String(person.name || '');
              if (!name || (id && id === executorId) || name === executorName || isExcludedPerson(name)) return;
              const key = id || name;
              if (!helpers.has(key)) helpers.set(key, { ...person, roles: new Set() });
              helpers.get(key).roles.add(role);
            });
          };
          addHelpers('Соисполнители', 'Соисполнитель');
          addHelpers('Наблюдатели', 'Наблюдатель');

          helpers.forEach(person => {
            const deptName = rootFor(person.dept);
            if (deptName === 'Без отдела') return;
            if (!groups.has(deptName)) {
              groups.set(deptName, { name: deptName, rows: [], people: new Map(), overdueDays: 0, overdueTasks: 0 });
            }
            const group = groups.get(deptName);
            if (!group.people.has(person.name)) {
              group.people.set(person.name, {
                name: person.name,
                id: String(person.id || ''),
                avatar: person.avatar || '',
                rows: [],
                helping: new Map(),
                overdueDays: 0,
                overdueTasks: 0
              });
            }
            const emp = group.people.get(person.name);
            if (!emp.helping) emp.helping = new Map();
            const taskKey = String(row['ID задачи'] || rowIndex);
            emp.helping.set(taskKey, { row, roles: Array.from(person.roles) });
          });
        });

        const depts = Array.from(groups.values()).sort((a, b) => b.rows.length - a.rows.length);
        if (!depts.length) {
          ids.structureWrap.innerHTML = '<div class="loading-panel">Нет данных для структуры</div>';
          renderStats(state.filteredRows);
          return;
        }

        const maxOverdue = Math.max(...depts.map(d => d.overdueDays), 1);
        const taskQuality = row => {
          const status = String(row['Состояние задачи'] || '');
          const days = Math.max(0, parseInt(row['Просрочка, дней']) || 0);
          if (status === 'Закрыта в срок' || status === 'Открыта в срок') return 100;
          if (status === 'Закрыта с просрочкой') return Math.max(50, 100 - Math.min(days, 25) * 2);
          if (status === 'Открыта просрочена') return Math.max(0, 70 - Math.min(days, 14) * 5);
          if (status === 'Без дедлайна') return 75;
          return 75;
        };
        const scoreForRows = rows => {
          if (!rows.length) return null;
          const executionQuality = rows.reduce((sum, row) => sum + taskQuality(row), 0) / rows.length;
          const currentOverdue = rows.filter(row => row['Состояние задачи'] === 'Открыта просрочена');
          const currentOverdueDays = currentOverdue.reduce(
            (sum, row) => sum + Math.max(0, parseInt(row['Просрочка, дней']) || 0),
            0
          );
          const currentDiscipline = Math.max(0, 100 - currentOverdue.length * 20 - currentOverdueDays * 2);
          return Math.round(executionQuality * .7 + currentDiscipline * .3);
        };
        const rosterByDept = new Map();
        (state.allEmployees || []).forEach(emp => {
          if (!emp || !emp.name || isExcludedPerson(emp.name)) return;
          const deptName = rootFor(emp.dept);
          if (deptName === 'Без отдела') return;
          if (!rosterByDept.has(deptName)) rosterByDept.set(deptName, new Set());
          rosterByDept.get(deptName).add(String(emp.id || emp.name));
        });
        depts.forEach(d => {
          d.score = scoreForRows(d.rows);
          d.employeeCount = rosterByDept.get(d.name)?.size || d.people.size;
          d.workloadRatio = d.employeeCount ? d.rows.length / d.employeeCount : 0;
          d.people.forEach(e => {
            e.score = scoreForRows(e.rows);
            e.planScore = scoreForRows(e.rows.filter(row => String(row['ID проекта'] || '') === OP_GROUP_ID));
          });
        });
        const ratioDepts = depts.filter(d => d.employeeCount > 0);
        const tbu = ratioDepts.length
          ? ratioDepts.reduce((sum, d) => sum + d.workloadRatio, 0) / ratioDepts.length
          : 0;
        const deptOrder = ['АУ', 'ФУ', 'УРК', 'УРБ', 'Оптимизация'];
        const ratioSorted = ratioDepts.slice().sort((a, b) => {
          const ai = deptOrder.indexOf(a.name);
          const bi = deptOrder.indexOf(b.name);
          return (ai < 0 ? 99 : ai) - (bi < 0 ? 99 : bi);
        });
        const chartMax = Math.max(1, Math.ceil(Math.max(tbu, ...ratioSorted.map(d => d.workloadRatio)) * 1.2));
        const chartLeft = 70;
        const chartRight = 930;
        const chartTop = 24;
        const chartBottom = 148;
        const chartWidth = chartRight - chartLeft;
        const chartHeight = chartBottom - chartTop;
        const xFor = index => ratioSorted.length === 1
          ? (chartLeft + chartRight) / 2
          : chartLeft + index * chartWidth / (ratioSorted.length - 1);
        const yFor = value => chartBottom - value / chartMax * chartHeight;
        const gridValues = [0, chartMax / 2, chartMax];
        const ratioGrid = gridValues.map(value => {
          const y = yFor(value);
          return `<line x1="${chartLeft}" y1="${y.toFixed(1)}" x2="${chartRight}" y2="${y.toFixed(1)}" stroke="#dfe3de" stroke-width="1"/>
            <text x="${chartLeft - 14}" y="${(y + 5).toFixed(1)}" text-anchor="end" fill="#7c837c" font-size="15">${value.toFixed(1)}</text>`;
        }).join('');
        const ratioPath = ratioSorted.map((d, index) => `${xFor(index).toFixed(1)},${yFor(d.workloadRatio).toFixed(1)}`).join(' ');
        const ratioPoints = ratioSorted.map((d, index) => {
          const x = xFor(index);
          const y = yFor(d.workloadRatio);
          return `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="8" fill="#317fd4" stroke="#ffffff" stroke-width="3"/>
            <text x="${x.toFixed(1)}" y="${(y - 16).toFixed(1)}" text-anchor="middle" fill="#243024" font-size="19" font-weight="800">${d.workloadRatio.toFixed(1)}</text>
            <text x="${x.toFixed(1)}" y="${chartBottom + 27}" text-anchor="middle" fill="#243024" font-size="17" font-weight="750">${escapeHtml(d.name)}</text>`;
        }).join('');
        const tbuY = yFor(tbu);
        const ratioDiagram = `<svg class="sd-ratio-svg" viewBox="0 0 1000 200" role="img" aria-label="Диаграмма нагрузки по отделам и средняя линия ТБУ">
          ${ratioGrid}
          <line x1="${chartLeft}" y1="${chartBottom}" x2="${chartRight}" y2="${chartBottom}" stroke="#aeb5ae" stroke-width="1.5"/>
          <line x1="${chartLeft}" y1="${tbuY.toFixed(1)}" x2="${chartRight}" y2="${tbuY.toFixed(1)}" stroke="#e54c50" stroke-width="3" stroke-dasharray="9 7"/>
          <text x="${chartRight}" y="${(tbuY - 9).toFixed(1)}" text-anchor="end" fill="#c63e43" font-size="17" font-weight="800">ТБУ ${tbu.toFixed(1)}</text>
          <polyline points="${ratioPath}" fill="none" stroke="#317fd4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
          ${ratioPoints}
        </svg>`;
        const ratioFormulas = ratioSorted.map(d =>
          `<span class="sd-ratio-formula">${escapeHtml(d.name)}: ${d.rows.length} / ${d.employeeCount} = <strong>${d.workloadRatio.toFixed(1)}</strong></span>`
        ).join('');

        const palette = ['#317fd4', '#92938c', '#5141aa', '#1eae79', '#f26a3d', '#7666c8', '#2c9db1'];
        const totalTasks = depts.reduce((sum, d) => sum + d.rows.length, 0);
        const stack = depts.map((d, index) => {
          const width = totalTasks ? d.rows.length / totalTasks * 100 : 0;
          return `<div class="sd-stack-item" style="width:${width.toFixed(2)}%;background:${palette[index % palette.length]}">
            <span class="sd-stack-value">${d.rows.length}</span>
            <span class="sd-stack-label">${escapeHtml(d.name)}</span>
          </div>`;
        }).join('');

        const bars = depts
          .slice()
          .sort((a, b) => b.overdueDays - a.overdueDays)
          .map(d => `<div class="sd-bar-row">
            <span class="sd-bar-name">${escapeHtml(d.name)}</span>
            <div class="sd-bar-track"><div class="sd-bar-fill" style="width:${(d.overdueDays / maxOverdue * 100).toFixed(1)}%"></div></div>
            <span class="sd-bar-value">${d.overdueDays}</span>
          </div>`).join('');

        const healthFor = d => {
          if (d.score === null) return ['Нет оценки', 'stable'];
          if (d.score >= 90) return ['Лидер', 'leader'];
          if (d.score >= 75) return ['Стабильно', 'stable'];
          if (d.score >= 60) return ['Перегруз', 'overload'];
          return ['Риск', 'risk'];
        };

        const cards = depts.map((d, index) => {
          const [health, healthClass] = healthFor(d);
          const people = Array.from(d.people.values()).sort((a, b) => (b.score ?? -1) - (a.score ?? -1) || a.name.localeCompare(b.name, 'ru'));
          const peopleRows = people.map(emp => {
            const sortedRows = rows => rows.slice().sort((a, b) => {
              const aOverdue = a['Состояние задачи'] === 'Открыта просрочена' ? 0 : 1;
              const bOverdue = b['Состояние задачи'] === 'Открыта просрочена' ? 0 : 1;
              if (aOverdue !== bOverdue) return aOverdue - bOverdue;
              return String(a.deadlineRaw || '9999').localeCompare(String(b.deadlineRaw || '9999'));
            });
            const renderTaskRow = (row, roles = []) => {
              const taskId = String(row['ID задачи'] || '');
              const title = escapeHtml(row['Название задачи'] || 'Без названия');
              const titleHtml = state.portalHost && /^\d+$/.test(taskId)
                ? `<a class="task-link" target="_blank" href="https://${escapeHtml(state.portalHost)}/company/personal/user/0/tasks/task/view/${taskId}/">${title}</a>`
                : title;
              const status = String(row['Состояние задачи'] || 'Без статуса');
              const statusClass = status === 'Открыта просрочена'
                ? 'danger'
                : (status.startsWith('Закрыта') ? 'success' : '');
              return `<div class="sd-task">
                <div class="sd-task-title">${titleHtml}${roles.length ? `<span class="sd-task-role">${escapeHtml(roles.join(' · '))}</span>` : ''}</div>
                <span class="sd-task-status ${statusClass}">${escapeHtml(status)}</span>
                <span class="sd-task-deadline">${escapeHtml(row['Дедлайн'] || 'Без срока')}</span>
              </div>`;
            };
            const ownTaskRows = sortedRows(emp.rows).map(row => renderTaskRow(row)).join('');
            const helpingItems = Array.from((emp.helping || new Map()).values());
            const helpingRows = sortedRows(helpingItems.map(item => item.row)).map(row => {
              const item = helpingItems.find(value => value.row === row);
              return renderTaskRow(row, item ? item.roles : []);
            }).join('');
            const ownSection = ownTaskRows
              ? `<div class="sd-task-section-title">Исполняет</div><div class="sd-task-list">${ownTaskRows}</div>`
              : '';
            const helpingSection = helpingRows
              ? `<div class="sd-task-section-title help">Помогает</div><div class="sd-task-list">${helpingRows}</div>`
              : '';
            return `<details class="sd-person-card">
              <summary class="sd-person">
                <span class="sd-person-name"><span class="sd-person-chevron">›</span>${escapeHtml(emp.name)}</span>
                <span class="sd-person-num">${emp.rows.length} зад.</span>
                <span class="sd-help-count">${helpingItems.length || '—'}</span>
                <span class="sd-person-num">${emp.overdueDays} дн.</span>
                <div class="sd-person-scores">
                  <div class="sd-score-line"><span class="sd-score-label">Все</span><div class="sd-person-bar"><div class="sd-person-fill" style="width:${emp.score ?? 0}%"></div></div></div>
                  <div class="sd-score-line"><span class="sd-score-label">По плану</span><div class="sd-person-bar"><div class="sd-person-fill plan" style="width:${emp.planScore ?? 0}%"></div></div></div>
                </div>
                <span class="sd-person-score"><span>${emp.score ?? '—'}</span><span class="plan">${emp.planScore ?? '—'}</span></span>
              </summary>
              ${ownSection}${helpingSection}
            </details>`;
          }).join('');
          return `<details class="sd-dept"${index === 0 ? ' open' : ''}>
            <summary class="sd-dept-head">
              <div class="sd-dept-who">
                <span class="sd-chevron">›</span>
                <span class="sd-dept-name">${escapeHtml(d.name)}</span>
                <span class="sd-health ${healthClass}">${health}</span>
              </div>
              <span class="sd-dept-meta">${d.rows.length} зад. · ${d.overdueDays} дн.</span>
              <span class="sd-score">${d.score ?? '—'}</span>
            </summary>
            <div class="sd-people">
              <div class="sd-person-head"><span>Исполнитель</span><span>Задач</span><span>Помогает</span><span>Проср.</span><span>Оценка: все / по плану</span><span></span></div>
              ${peopleRows}
            </div>
          </details>`;
        }).join('');

        ids.structureWrap.innerHTML = `<div class="sd-page">
          <section class="sd-section">
            <h2 class="sd-title">1. Распределение задач по отделам</h2>
            <div class="sd-stack">${stack}</div>
            <p class="sd-note">Ширина блока — доля отдела в общем объёме ${totalTasks} задач.</p>
          </section>
          <section class="sd-section">
            <div class="sd-ratio-head">
              <h2 class="sd-title">2. Нагрузка: задач на одного сотрудника</h2>
              <span class="sd-tbu">ТБУ: ${tbu.toFixed(1)}</span>
            </div>
            <div class="sd-ratio-chart">${ratioDiagram}</div>
            <div class="sd-ratio-formulas">${ratioFormulas}</div>
            <div class="sd-ratio-legend">
              <span><i class="sd-ratio-key"></i>Коэффициенты отделов</span>
              <span><i class="sd-ratio-key tbu"></i>ТБУ — среднее по отделам</span>
            </div>
            <p class="sd-note">Коэффициент = задачи выбранного периода / количество сотрудников отдела.</p>
          </section>
          <section class="sd-section">
            <h2 class="sd-title">3. Текущая открытая просрочка по отделам, дней</h2>
            <div class="sd-chart">${bars}</div>
            <div class="sd-axis"><span>0</span><span>${Math.round(maxOverdue / 2)}</span><span>${maxOverdue}</span></div>
          </section>
          <section class="sd-section">
            <h2 class="sd-title">4. Структура и итоговая оценка</h2>
            <p class="sd-subtitle">Оценка 0–100: 70% качество исполнения + 30% текущая дисциплина. Открытая просрочка снижает балл независимо от общего числа задач; объём не даёт бонуса.</p>
            <div class="sd-departments">${cards}</div>
          </section>
        </div>`;

        renderStats(state.filteredRows);
      }

      // ── Table dispatcher ──────────────────────────────────────────────
      function renderTable() {
        document.body.classList.toggle('gallery-active', state.viewMode === 'table3' || state.viewMode === 'table7');
        if (ids.structureWrap) ids.structureWrap.hidden = true;
        if (state.viewMode === 'table1') { renderStructureDashboard(); return; }
        if (state.viewMode === 'table4') { renderAIAnalysis(); return; }
        if (state.viewMode === 'table5') { renderZRSGallery(); return; }
        if (state.viewMode === 'table6') { renderPlan(); return; }
        if (state.viewMode === 'table7') { renderPlanTasks(); return; }
        if (state.viewMode === 'table3') { renderGallery(); return; }
        ids.aiAnalysisWrap.hidden = true;
        ids.galleryWrap.hidden = true;
        ids.zrsWrap.hidden = true;
        if (ids.planWrap) ids.planWrap.hidden = true;
        if (ids.planTasksWrap) ids.planTasksWrap.hidden = true;
        if (state.viewMode === 'table2') { renderLeaderboard(); return; }

        const tree = {};
        
        // Calculate cross-department assignments
        const deptAssignedToOthers = {};
        const empAssignedToOthers = {};

        state.filteredRows.forEach((row) => {
          const assigneeDept = row['Отдел'] || 'Без отдела';
          const creator = row['Постановщик'] || 'Без постановщика';
          const creatorDept = row['Отдел постановщика'] || 'Без отдела';

          if (creatorDept !== assigneeDept) {
            // 1. Department stats
            if (!deptAssignedToOthers[creatorDept]) {
              deptAssignedToOthers[creatorDept] = { total: 0, targets: {} };
            }
            deptAssignedToOthers[creatorDept].total += 1;
            deptAssignedToOthers[creatorDept].targets[assigneeDept] = (deptAssignedToOthers[creatorDept].targets[assigneeDept] || 0) + 1;

            // 2. Employee stats
            if (!empAssignedToOthers[creator]) {
              empAssignedToOthers[creator] = { total: 0, targets: {} };
            }
            empAssignedToOthers[creator].total += 1;
            empAssignedToOthers[creator].targets[assigneeDept] = (empAssignedToOthers[creator].targets[assigneeDept] || 0) + 1;
          }
        });

        // Helpers to format badge
        const formatDeptCrossAssignments = (deptName) => {
          const data = deptAssignedToOthers[deptName];
          if (!data || data.total === 0) return '';
          const parts = Object.entries(data.targets).map(([tDept, count]) => `${escapeHtml(tDept)}: ${count}`);
          return `<span style="font-size: 10px; color: var(--text-muted); font-weight: 500; margin-left: 8px; border-left: 2px solid var(--brand-green); padding-left: 6px;">→ другим: ${data.total} (${parts.join(', ')})</span>`;
        };

        const formatEmpCrossAssignments = (empName) => {
          const data = empAssignedToOthers[empName];
          if (!data || data.total === 0) return '';
          const parts = Object.entries(data.targets).map(([tDept, count]) => `${escapeHtml(tDept)}: ${count}`);
          return `<span style="font-size: 9.5px; color: var(--text-muted); font-weight: 500; margin-left: 8px; border-left: 2px solid #ccc; padding-left: 6px;">→ другим: ${data.total} (${parts.join(', ')})</span>`;
        };


        // (formatTasks / formatDays / formatPoints are module-level functions above)


        // Helper to render an employee's tasks
        const renderEmployeeTasks = (emp, deptName, empName, indentOffset = 0) => {
          let empHtml = '';
          const sortedTasks = emp.tasks.slice().sort((a, b) => {
            const isAImportant = a.priority == '2' || a.priority == 2 || String(a.priority).toLowerCase().includes('high') || String(a.priority).toLowerCase().includes('важн');
            const isBImportant = b.priority == '2' || b.priority == 2 || String(b.priority).toLowerCase().includes('high') || String(b.priority).toLowerCase().includes('важн');

            if (isAImportant && !isBImportant) return -1;
            if (!isAImportant && isBImportant) return 1;

            const getDeadlineTime = (t) => {
              if (t.deadlineRaw) {
                const d = new Date(t.deadlineRaw);
                if (!Number.isNaN(d.getTime())) return d.getTime();
              }
              if (t.deadline) {
                const d = parseDateStr(t.deadline);
                if (d) return d.getTime();
              }
              return Infinity;
            };

            const dateA = getDeadlineTime(a);
            const dateB = getDeadlineTime(b);
            
            if (dateA !== dateB) {
              return dateA - dateB;
            }

            const getCreatedTime = (t) => {
              if (t.createdDateRaw) {
                const d = new Date(t.createdDateRaw);
                if (!Number.isNaN(d.getTime())) return d.getTime();
              }
              if (t.created) {
                const d = parseDateStr(t.created);
                if (d) return d.getTime();
              }
              return 0;
            };

            return getCreatedTime(a) - getCreatedTime(b);
          });

          // Separate active and closed tasks
          const activeTasks = [];
          const closedTasks = [];
          
          sortedTasks.forEach((t) => {
            const isClosed = t.state && t.state.startsWith('Закрыта');
            if (isClosed) {
              closedTasks.push(t);
            } else {
              activeTasks.push(t);
            }
          });

          // Render active tasks
          activeTasks.forEach((task) => {
            const isImportant = task.priority == '2' || task.priority == 2 || String(task.priority).toLowerCase().includes('high') || String(task.priority).toLowerCase().includes('важн');
            const taskIcon = isImportant ? '🔥' : '📋';
            let taskTitleHtml = escapeHtml(task.title);
            if (state.portalHost && task.id) {
              const idNum = String(task.id).replace('#', '').trim();
              taskTitleHtml = `<a href="https://${state.portalHost}/company/personal/user/0/tasks/task/view/${idNum}/" target="_blank" class="task-link">${taskTitleHtml}</a>`;
            }
            
            let projectPrefix = '';
            if (task.project && String(task.project).trim() !== '' && String(task.project).trim() !== '0') {
              projectPrefix = `<span style="font-weight: 800; color: var(--text-dark); margin-right: 6px;">[${escapeHtml(task.project)}]</span>`;
            }
            
            let rowClass = '';
            let statusBadge = '';
            
            if (task.state && !task.state.startsWith('Закрыта') && task.deadlineRaw) {
              const deadlineDate = new Date(task.deadlineRaw);
              if (!Number.isNaN(deadlineDate.getTime())) {
                const now = new Date();
                const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                const target = new Date(deadlineDate.getFullYear(), deadlineDate.getMonth(), deadlineDate.getDate());
                const diffTime = target - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                
                if (diffTime < 0) {
                  rowClass = 'row-overdue';
                  statusBadge = ' <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #fee2e2; color: #ef4444; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Просрочено</span>';
                } else if (diffDays === 0) {
                  rowClass = 'row-today';
                  statusBadge = ' <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #ffedd5; color: #f97316; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Дедлайн сегодня</span>';
                } else if (diffDays > 0 && diffDays <= 3) {
                  rowClass = 'row-soon';
                  statusBadge = ' <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #fef9c3; color: #ca8a04; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Скоро дедлайн</span>';
                }
              }
            }
            
            empHtml += `
              <tr class="tree-row tree-level-3 ${rowClass}">
                <td style="padding-left: ${48 + indentOffset}px; color: #555555;">${taskIcon} ${projectPrefix}${taskTitleHtml}${statusBadge}</td>
                <td>${escapeHtml(removeYear(task.deadlineRaw, task.deadline))}</td>
                <td>${escapeHtml(formatShortName(task.creator))}</td>
                <td></td>
                <td></td>
                <td class="${task.overdue > 0 ? 'color-danger' : ''}">${task.overdue > 0 ? formatDays(task.overdue) : ''}</td>
                <td class="${task.efficiency < 0 ? 'color-danger' : (task.efficiency > 0 ? 'color-success' : '')}">${formatPoints(task.efficiency)}</td>
              </tr>
            `;
          });

          // Render Closed Tasks folder if there are any
          if (closedTasks.length > 0) {
            const closedFolderKey = `closed:${deptName}:${empName}`;
            const isClosedFolderExpanded = state.expandedNodes.has(closedFolderKey);
            const closedFolderToggleIcon = isClosedFolderExpanded ? '▼' : '▶';
            const closedScore = closedTasks.reduce((s, t) => s + (t.efficiency || 0), 0);
            const closedScoreBadge = `<span style="display:inline-block;margin-left:8px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:800;background:rgba(100,100,100,0.1);color:#64748b;">${closedScore > 0 ? '+' : ''}${closedScore} б.</span>`;

            empHtml += `
              <tr class="tree-row tree-level-3 closed-tasks-folder" data-key="${closedFolderKey}" style="font-weight: 600; background-color: rgba(200, 200, 200, 0.1); cursor: pointer; color: var(--text-muted);">
                <td style="padding-left: ${48 + indentOffset}px;"><span class="tree-toggle">${closedFolderToggleIcon}</span> 📁 Закрытые задачи (${closedTasks.length})${closedScoreBadge}</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            `;
            
            if (isClosedFolderExpanded) {
              closedTasks.forEach((task) => {
                const isImportant = task.priority == '2' || task.priority == 2 || String(task.priority).toLowerCase().includes('high') || String(task.priority).toLowerCase().includes('важн');
                const taskIcon = isImportant ? '🔥' : '📋';
                let taskTitleHtml = escapeHtml(task.title);
                if (state.portalHost && task.id) {
                  const idNum = String(task.id).replace('#', '').trim();
                  taskTitleHtml = `<a href="https://${state.portalHost}/company/personal/user/0/tasks/task/view/${idNum}/" target="_blank" class="task-link" style="color: #888888; border-bottom-color: rgba(136, 136, 136, 0.4); font-weight: 500;">${taskTitleHtml}</a>`;
                }
                
                let projectPrefix = '';
                if (task.project && String(task.project).trim() !== '' && String(task.project).trim() !== '0') {
                  projectPrefix = `<span style="font-weight: 800; color: #888888; margin-right: 6px;">[${escapeHtml(task.project)}]</span>`;
                }
                
                const closedRowBg = task.overdue > 0 ? 'rgba(239, 68, 68, 0.08)' : 'rgba(240, 240, 240, 0.3)';
                
                empHtml += `
                  <tr class="tree-row tree-level-4 closed-task-row" style="background-color: ${closedRowBg}; color: #888888;">
                    <td style="padding-left: ${68 + indentOffset}px; color: #888888;">${taskIcon} ${projectPrefix}<span>${taskTitleHtml}</span> <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #475569; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Закрыта</span></td>
                    <td style="color: #888888; white-space: normal; line-height: 1.25; font-size: 10.5px;">
                      <div style="font-size: 9.5px; opacity: 0.8;">🏁 ${escapeHtml(removeYear(task.deadlineRaw, task.deadline))}</div>
                      <div style="font-weight: 600; margin-top: 1px;">✔️ ${escapeHtml(removeYear(task.closedDateRaw, task.closed))}</div>
                    </td>
                    <td style="color: #888888;">${escapeHtml(formatShortName(task.creator))}</td>
                    <td></td>
                    <td></td>
                    <td class="${task.overdue > 0 ? 'color-danger' : ''}" style="color: #888888 !important; opacity: 0.8;">${task.overdue > 0 ? formatDays(task.overdue) : ''}</td>
                    <td class="${task.efficiency < 0 ? 'color-danger' : (task.efficiency > 0 ? 'color-success' : '')}" style="opacity: 0.8;">${formatPoints(task.efficiency)}</td>
                  </tr>
                `;
              });
            }
          }
          // Render Delegated Tasks folder — only tasks assigned to someone else
          const delegatedTasks = (emp.delegatedTasks || []).filter(t => t.assignee !== empName);
          if (delegatedTasks.length > 0) {
            const delegFolderKey = `delegated:${deptName}:${empName}`;
            const isDelegFolderExpanded = state.expandedNodes.has(delegFolderKey);
            const delegFolderToggleIcon = isDelegFolderExpanded ? '▼' : '▶';
            const delegScore = delegatedTasks.reduce((s, t) => s + (t.efficiency || 0), 0);
            const delegScoreBadge = `<span style="display:inline-block;margin-left:8px;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:800;background:rgba(99,152,240,0.12);color:#3b6fd4;">${delegScore > 0 ? '+' : ''}${delegScore} б.</span>`;

            empHtml += `
              <tr class="tree-row tree-level-3 closed-tasks-folder" data-key="${delegFolderKey}" style="font-weight: 600; background-color: rgba(99, 152, 240, 0.07); cursor: pointer; color: var(--text-muted);">
                <td style="padding-left: ${48 + indentOffset}px;"><span class="tree-toggle">${delegFolderToggleIcon}</span> 📂 Порученные (${delegatedTasks.length})${delegScoreBadge}</td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
                <td></td>
              </tr>
            `;

            if (isDelegFolderExpanded) {
              delegatedTasks.forEach((task) => {
                const isClosed = task.state && task.state.startsWith('Закрыта');
                const isImportant = task.priority == '2' || task.priority == 2 || String(task.priority).toLowerCase().includes('high') || String(task.priority).toLowerCase().includes('важн');
                const taskIcon = isImportant ? '🔥' : '📋';
                let taskTitleHtml = escapeHtml(task.title);
                if (state.portalHost && task.id) {
                  const idNum = String(task.id).replace('#', '').trim();
                  const linkStyle = isClosed ? 'color: #888888; border-bottom-color: rgba(136, 136, 136, 0.4); font-weight: 500;' : '';
                  taskTitleHtml = `<a href="https://${state.portalHost}/company/personal/user/0/tasks/task/view/${idNum}/" target="_blank" class="task-link" style="${linkStyle}">${taskTitleHtml}</a>`;
                }

                let projectPrefix = '';
                if (task.project && String(task.project).trim() !== '' && String(task.project).trim() !== '0') {
                  projectPrefix = `<span style="font-weight: 800; color: ${isClosed ? '#888' : 'var(--text-dark)'}; margin-right: 6px;">[${escapeHtml(task.project)}]</span>`;
                }

                let stateBadge = '';
                if (isClosed) {
                  stateBadge = ` <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #e2e8f0; color: #475569; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Закрыта</span>`;
                } else if (task.deadlineRaw) {
                  const deadlineDate = new Date(task.deadlineRaw);
                  if (!Number.isNaN(deadlineDate.getTime())) {
                    const now = new Date();
                    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
                    const target = new Date(deadlineDate.getFullYear(), deadlineDate.getMonth(), deadlineDate.getDate());
                    const diffDays = Math.ceil((target - today) / (1000 * 60 * 60 * 24));
                    if (diffDays < 0) {
                      stateBadge = ` <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #fee2e2; color: #ef4444; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Просрочено</span>`;
                    } else if (diffDays === 0) {
                      stateBadge = ` <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #ffedd5; color: #f97316; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Дедлайн сегодня</span>`;
                    } else if (diffDays <= 3) {
                      stateBadge = ` <span style="font-size: 9px; padding: 2px 6px; border-radius: 4px; background: #fef9c3; color: #ca8a04; font-weight: 700; margin-left: 6px; vertical-align: middle; white-space: nowrap;">Скоро дедлайн</span>`;
                    }
                  }
                }

                const assigneeLabel = task.assignee ? `<span style="font-size: 10px; color: #6b9ef0; margin-left: 6px;">→ ${escapeHtml(formatShortName(task.assignee))}</span>` : '';
                const rowStyle = isClosed ? 'background-color: rgba(240, 240, 240, 0.3); color: #888888;' : 'background-color: rgba(99, 152, 240, 0.04);';
                const titleColor = isClosed ? 'color: #888888;' : 'color: #555555;';

                empHtml += `
                  <tr class="tree-row tree-level-4" style="${rowStyle}">
                    <td style="padding-left: ${68 + indentOffset}px; ${titleColor}">${taskIcon} ${projectPrefix}<span>${taskTitleHtml}</span>${stateBadge}${assigneeLabel}</td>
                    <td style="${isClosed ? 'color: #888888; white-space: normal; line-height: 1.25; font-size: 10.5px;' : ''}">
                      ${isClosed
                        ? `<div style="font-size: 9.5px; opacity: 0.8;">🏁 ${escapeHtml(removeYear(task.deadlineRaw, task.deadline))}</div><div style="font-weight: 600; margin-top: 1px;">✔️ ${escapeHtml(removeYear(task.closedDateRaw, task.closed))}</div>`
                        : escapeHtml(removeYear(task.deadlineRaw, task.deadline))
                      }
                    </td>
                    <td></td>
                    <td></td>
                    <td></td>
                    <td class="${task.overdue > 0 ? 'color-danger' : ''}" style="${isClosed ? 'opacity: 0.8;' : ''}">${task.overdue > 0 ? formatDays(task.overdue) : ''}</td>
                    <td></td>
                  </tr>
                `;
              });
            }
          }

          return empHtml;
        };

        // Build departments maps for dynamic nesting walk-up
        const depById = {};
        const depByName = {};
        // Set of user IDs who are department heads (UF_HEAD)
        headUserIds = new Set();
        if (state.departments) {
          state.departments.forEach(d => {
            depById[String(d.ID)] = d;
            depByName[d.NAME] = d;
            if (d.UF_HEAD) headUserIds.add(String(d.UF_HEAD));
          });
        }

        // Map: employee display name → user ID (built from rows)
        const empNameToId = new Map();
        state.filteredRows.forEach(row => {
          const name = row['Исполнитель'];
          const id = String(row['ID исполнителя'] || '');
          if (name && id && !empNameToId.has(name)) empNameToId.set(name, id);
        });

        function isHead(empName) {
          const id = empNameToId.get(empName);
          return id && headUserIds.has(id);
        }

        // Helper to find parent-child relationship dynamically
        function getDeptGroupAndSub(deptName) {
          const chain = [];
          let current = depByName[deptName];
          while (current) {
            chain.push(current);
            if (current.PARENT) {
              current = depById[String(current.PARENT)];
            } else {
              current = null;
            }
          }
          
          // Top-level departments = direct children of АУП (ID: 157)
          // Аккаунты is a sub of УКС, so it must NOT be listed here
          const topLevelNames = ['УКС', 'ФУ', 'УРБ', 'АУ', 'I1C', 'ПС'];
          
          let topIndex = chain.findIndex(d => topLevelNames.includes(d.NAME));
          if (topIndex !== -1) {
            const topDept = chain[topIndex];
            if (topIndex === 0) {
              return { dept: topDept.NAME, subDept: null };
            } else {
              return { dept: topDept.NAME, subDept: deptName };
            }
          }
          
          if (chain.length > 1) {
            let idx = chain.length - 1;
            while (idx >= 0 && (chain[idx].ID === '1' || chain[idx].ID === '157' || chain[idx].NAME === 'IC Group' || chain[idx].NAME === 'АУП')) {
              idx--;
            }
            if (idx >= 0) {
              const topDeptName = chain[idx].NAME;
              if (topDeptName === deptName) {
                return { dept: deptName, subDept: null };
              } else {
                return { dept: topDeptName, subDept: deptName };
              }
            }
          }
          
          return { dept: deptName, subDept: null };
        }

        // Group the rows dynamically on client-side
        state.filteredRows.forEach((row) => {
          let dept = row['Отдел'] || 'Без отдела';
          const assignee = row['Исполнитель'] || 'Без исполнителя';
          if (isExcludedPerson(assignee)) return;
          const taskTitle = row['Название задачи'] || 'Без названия';
          
          const overdue = parseInt(row['Просрочка, дней']) || 0;
          // Балл за задачу = важность AI × доля за статус — как в рейтинге
          const efficiency = taskExecutorScore(row);

          let subDept = null;
          if (dept !== 'Без отдела') {
            const resolved = getDeptGroupAndSub(dept);
            dept = resolved.dept;
            subDept = resolved.subDept;
          }
          
          if (!tree[dept]) {
            tree[dept] = { 
              name: dept, 
              overdueSum: 0, 
              efficiencySum: 0, 
              employees: {},
              subDepts: {}
            };
          }
          tree[dept].overdueSum += overdue;
          tree[dept].efficiencySum += efficiency;
          
          const taskData = {
            id: row['ID задачи'],
            title: taskTitle,
            overdue: overdue,
            efficiency: efficiency,
            importance: row['AI важность'],
            creator: row['Постановщик'],
            priority: row['Приоритет'],
            deadline: row['Дедлайн'],
            deadlineRaw: row['deadlineRaw'],
            createdDateRaw: row['createdDateRaw'],
            created: row['Дата создания'],
            state: row['Состояние задачи'],
            closed: row['Дата закрытия'],
            closedDateRaw: row['closedDateRaw'],
            project: row['Проект']
          };

          if (subDept) {
            if (!tree[dept].subDepts[subDept]) {
              tree[dept].subDepts[subDept] = {
                name: subDept,
                overdueSum: 0,
                efficiencySum: 0,
                employees: {}
              };
            }
            tree[dept].subDepts[subDept].overdueSum += overdue;
            tree[dept].subDepts[subDept].efficiencySum += efficiency;
            
            if (!tree[dept].subDepts[subDept].employees[assignee]) {
              tree[dept].subDepts[subDept].employees[assignee] = {
                name: assignee,
                overdueSum: 0,
                efficiencySum: 0,
                tasks: []
              };
            }
            tree[dept].subDepts[subDept].employees[assignee].overdueSum += overdue;
            tree[dept].subDepts[subDept].employees[assignee].efficiencySum += efficiency;
            tree[dept].subDepts[subDept].employees[assignee].tasks.push(taskData);
          } else {
            if (!tree[dept].employees[assignee]) {
              tree[dept].employees[assignee] = {
                name: assignee,
                overdueSum: 0,
                efficiencySum: 0,
                tasks: []
              };
            }
            tree[dept].employees[assignee].overdueSum += overdue;
            tree[dept].employees[assignee].efficiencySum += efficiency;
            tree[dept].employees[assignee].tasks.push(taskData);
          }
        });

        // Second pass: add delegation bonus to the CREATOR's node (matches Rating/Gallery totals).
        // Own department = +1 per task; another department = +round(0.5 * importance).
        state.filteredRows.forEach((row) => {
          const creatorName = row['Постановщик'];
          if (!creatorName || creatorName === 'Без постановщика') return;
          if (isExcludedPerson(creatorName)) return;
          // Нельзя «поручить» задачу самому себе — ни бонуса, ни папки «Порученные»
          const creatorId = String(row['ID постановщика'] || '');
          if (creatorId && String(row['ID исполнителя'] || '') === creatorId) return;
          let cDept = row['Отдел постановщика'] || 'Без отдела';
          const execDept = row['Отдел'] || 'Без отдела';
          const V = parseFloat(row['AI важность']) || 0;
          const bonus = (cDept !== execDept) ? Math.round(0.5 * V) : 1;

          let cSub = null;
          if (cDept !== 'Без отдела') {
            const r = getDeptGroupAndSub(cDept);
            cDept = r.dept;
            cSub = r.subDept;
          }
          if (!tree[cDept]) {
            tree[cDept] = { name: cDept, overdueSum: 0, efficiencySum: 0, employees: {}, subDepts: {} };
          }
          if (bonus) tree[cDept].efficiencySum += bonus;

          const delegTaskData = {
            id: row['ID задачи'],
            title: row['Название задачи'] || 'Без названия',
            assignee: row['Исполнитель'] || '',
            assigneeDept: execDept,
            state: row['Состояние задачи'],
            deadline: row['Дедлайн'],
            deadlineRaw: row['deadlineRaw'],
            closed: row['Дата закрытия'],
            closedDateRaw: row['closedDateRaw'],
            importance: row['AI важность'],
            overdue: parseInt(row['Просрочка, дней']) || 0,
            project: row['Проект'],
            priority: row['Приоритет'],
          };

          const ensureEmp = (map) => {
            if (!map[creatorName]) map[creatorName] = { name: creatorName, overdueSum: 0, efficiencySum: 0, tasks: [], delegationBonus: 0, delegatedTasks: [] };
            if (!map[creatorName].delegatedTasks) map[creatorName].delegatedTasks = [];
            if (bonus) {
              map[creatorName].efficiencySum += bonus;
              map[creatorName].delegationBonus = (map[creatorName].delegationBonus || 0) + bonus;
            }
            map[creatorName].delegatedTasks.push(delegTaskData);
          };
          if (cSub) {
            if (!tree[cDept].subDepts[cSub]) tree[cDept].subDepts[cSub] = { name: cSub, overdueSum: 0, efficiencySum: 0, employees: {} };
            if (bonus) tree[cDept].subDepts[cSub].efficiencySum += bonus;
            ensureEmp(tree[cDept].subDepts[cSub].employees);
          } else {
            ensureEmp(tree[cDept].employees);
          }
        });

        // Set columns headers
        const headers = ['Структура (Отдел → Исполнитель → Задача)', 'Дедлайн / Вып.', 'Поручил', 'Кол-во задач', 'В работе', 'Просрочка, дн.', 'Баллы'];
        ids.tableHead.innerHTML = headers.map(h => `<th>${h}</th>`).join('');

        let html = '';
        const depts = Object.keys(tree).sort();
        
        if (depts.length === 0) {
          ids.tableBody.innerHTML = `<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px;">Нет данных для группировки</td></tr>`;
          return;
        }
        
        depts.forEach((deptName) => {
          const dept = tree[deptName];
          const deptKey = `dept:${deptName}`;
          const isDeptExpanded = state.expandedNodes.has(deptKey);
          const deptIcon = isDeptExpanded ? '▼' : '▶';
          
          // Calculate Department tasks count (including sub-departments)
          let deptTasksCount = 0;
          let deptActiveCount = 0;
          Object.values(dept.employees).forEach(emp => {
            deptTasksCount += emp.tasks.length;
            deptActiveCount += emp.tasks.filter(t => !(t.state && t.state.startsWith('Закрыта'))).length;
          });
          if (dept.subDepts) {
            Object.values(dept.subDepts).forEach(sub => {
              Object.values(sub.employees).forEach(emp => {
                deptTasksCount += emp.tasks.length;
                deptActiveCount += emp.tasks.filter(t => !(t.state && t.state.startsWith('Закрыта'))).length;
              });
            });
          }
          
          // Render Department row
          html += `
            <tr class="tree-row tree-level-1" data-key="${deptKey}" style="font-weight: 700; background-color: rgba(138, 196, 63, 0.08); cursor: pointer;">
              <td><span class="tree-toggle">${deptIcon}</span> 📁 ${escapeHtml(deptName)}${formatDeptCrossAssignments(deptName)}</td>
              <td></td>
              <td></td>
              <td>${formatTasks(deptTasksCount)}</td>
              <td>${formatTasks(deptActiveCount)}</td>
              <td class="${dept.overdueSum > 0 ? 'color-danger' : ''}">${formatDays(dept.overdueSum)}</td>
              <td style="color:var(--text-muted);">—</td>
              <td class="${dept.efficiencySum < 0 ? 'color-danger' : (dept.efficiencySum > 0 ? 'color-success' : '')}">${formatPoints(dept.efficiencySum)}</td>
            </tr>
          `;
          
          if (isDeptExpanded) {
            // 1. Render sub-departments under this department
            if (dept.subDepts) {
              const subDeptsNames = Object.keys(dept.subDepts).sort();
              subDeptsNames.forEach((subDeptName) => {
                const subDept = dept.subDepts[subDeptName];
                const subDeptKey = `subdept:${deptName}:${subDeptName}`;
                const isSubExpanded = state.expandedNodes.has(subDeptKey);
                const subIcon = isSubExpanded ? '▼' : '▶';
                
                let subTasksCount = 0;
                let subActiveCount = 0;
                Object.values(subDept.employees).forEach(emp => {
                  subTasksCount += emp.tasks.length;
                  subActiveCount += emp.tasks.filter(t => !(t.state && t.state.startsWith('Закрыта'))).length;
                });
                
                // Render Sub-department row (Level 1.5, uses tree-level-2 styling)
                html += `
                  <tr class="tree-row tree-level-2" data-key="${subDeptKey}" style="font-weight: 800; background-color: rgba(138, 196, 63, 0.04); cursor: pointer;">
                    <td style="padding-left: 28px;"><span class="tree-toggle">${subIcon}</span> 📁 ${escapeHtml(subDeptName)}</td>
                    <td></td>
                    <td></td>
                    <td>${formatTasks(subTasksCount)}</td>
                    <td>${formatTasks(subActiveCount)}</td>
                    <td class="${subDept.overdueSum > 0 ? 'color-danger' : ''}">${formatDays(subDept.overdueSum)}</td>
                    <td style="color:var(--text-muted);">—</td>
                    <td class="${subDept.efficiencySum < 0 ? 'color-danger' : (subDept.efficiencySum > 0 ? 'color-success' : '')}">${formatPoints(subDept.efficiencySum)}</td>
                  </tr>
                `;
                
                if (isSubExpanded) {
                  const subEmployees = Object.keys(subDept.employees).sort();
                  subEmployees.forEach((empName) => {
                    const emp = subDept.employees[empName];
                    const empKey = `emp:${deptName}:${subDeptName}:${empName}`;
                    const isEmpExpanded = state.expandedNodes.has(empKey);
                    const empIcon = isEmpExpanded ? '▼' : '▶';
                    
                    const empTasksCount = emp.tasks.length;
                    const empActiveCount = emp.tasks.filter(t => !(t.state && t.state.startsWith('Закрыта'))).length;
                    const isEmpHead2 = isHead(empName);
                    
                    // Render Employee row under sub-department
                    html += `
                      <tr class="tree-row tree-level-2" data-key="${empKey}" style="font-weight: 800; background-color: rgba(233, 235, 232, 0.3); cursor: pointer;">
                        <td style="padding-left: 56px;"><span class="tree-toggle">${empIcon}</span> 👤 ${escapeHtml(empName)}${formatEmpCrossAssignments(empName)}</td>
                        <td></td>
                        <td></td>
                        <td>${formatTasks(empTasksCount)}</td>
                        <td>${formatTasks(empActiveCount)}</td>
                        <td class="${emp.overdueSum > 0 ? 'color-danger' : ''}">${formatDays(emp.overdueSum)}</td>
                        <td>${avgImportance(emp.tasks)}</td>
                        <td class="${emp.efficiencySum < 0 ? 'color-danger' : (emp.efficiencySum > 0 ? 'color-success' : '')}">${formatPoints(emp.efficiencySum)}</td>
                      </tr>
                    `;
                    
                    if (isEmpExpanded) {
                      html += renderEmployeeTasks(emp, `${deptName}:${subDeptName}`, empName, 28);
                    }
                  });
                }
              });
            }

            // 2. Render direct employees of this department
            const employees = Object.keys(dept.employees).sort();
            employees.forEach((empName) => {
              const emp = dept.employees[empName];
              const empKey = `emp:${deptName}:${empName}`;
              const isEmpExpanded = state.expandedNodes.has(empKey);
              const empIcon = isEmpExpanded ? '▼' : '▶';
              
              const empTasksCount = emp.tasks.length;
              const empActiveCount = emp.tasks.filter(t => !(t.state && t.state.startsWith('Закрыта'))).length;
              const isEmpHead = isHead(empName);
              
              // Render Employee row
              html += `
                <tr class="tree-row tree-level-2" data-key="${empKey}" style="font-weight: 800; background-color: rgba(233, 235, 232, 0.3); cursor: pointer;">
                  <td style="padding-left: 28px;"><span class="tree-toggle">${empIcon}</span> 👤 ${escapeHtml(empName)}${formatEmpCrossAssignments(empName)}</td>
                  <td></td>
                  <td></td>
                  <td>${formatTasks(empTasksCount)}</td>
                  <td>${formatTasks(empActiveCount)}</td>
                  <td class="${emp.overdueSum > 0 ? 'color-danger' : ''}">${formatDays(emp.overdueSum)}</td>
                  <td>${avgImportance(emp.tasks)}</td>
                  <td class="${emp.efficiencySum < 0 ? 'color-danger' : (emp.efficiencySum > 0 ? 'color-success' : '')}">${formatPoints(emp.efficiencySum)}</td>
                </tr>
              `;
              
              if (isEmpExpanded) {
                html += renderEmployeeTasks(emp, deptName, empName, 0);
              }
            });
          }
        });
        
        ids.tableBody.innerHTML = html;
        ids.rowCount.textContent = state.filteredRows.length;
        ids.tableWrap.hidden = false;
        renderStats(state.filteredRows);
        
        // Attach click listeners to expand/collapse toggles
        document.querySelectorAll('.tree-row[data-key]').forEach((row) => {
          row.addEventListener('click', (e) => {
            if (e.target.tagName === 'A') return; // Don't collapse if clicked on task link
            
            const key = row.getAttribute('data-key');
            if (state.expandedNodes.has(key)) {
              state.expandedNodes.delete(key);
            } else {
              state.expandedNodes.add(key);
            }
            renderTable();
          });
        });

        const table = document.querySelector('table');
        if (table && state.viewMode === 'table1') {
          let hasExpandedEmp = false;
          for (const key of state.expandedNodes) {
            if (key.startsWith('emp:')) {
              hasExpandedEmp = true;
              break;
            }
          }
          if (hasExpandedEmp) {
            table.classList.remove('hide-task-details');
          } else {
            table.classList.add('hide-task-details');
          }
        } else if (table) {
          table.classList.remove('hide-task-details');
        }

      }

      function escapeHtml(value) {
        return value
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Period boundaries in the user's local time. Returns null for "all time".
      function getPeriodRange(period) {
        if (!period || period === 'all') return null;

        const now = new Date();
        const y = now.getFullYear();
        const m = now.getMonth();
        const d = now.getDate();

        const day = now.getDay();
        const diffToMonday = d - day + (day === 0 ? -6 : 1);
        const startWeek = new Date(y, m, diffToMonday, 0, 0, 0, 0);

        switch (period) {
          case 'today':
            return { start: new Date(y, m, d, 0, 0, 0, 0), end: new Date(y, m, d, 23, 59, 59, 999) };
          case 'week':
            return { start: startWeek, end: new Date(startWeek.getTime() + 7 * 864e5 - 1) };
          case 'lastWeek':
            return { start: new Date(startWeek.getTime() - 7 * 864e5), end: new Date(startWeek.getTime() - 1) };
          case 'month':
            return { start: new Date(y, m, 1, 0, 0, 0, 0), end: new Date(y, m + 1, 0, 23, 59, 59, 999) };
          case 'lastMonth':
            return { start: new Date(y, m - 1, 1, 0, 0, 0, 0), end: new Date(y, m, 0, 23, 59, 59, 999) };
          default:
            return null;
        }
      }

      function applyFilters() {
        const period = ids.periodSelect ? ids.periodSelect.value : 'all';

        let filtered = state.rows.filter(r => !(r['Название задачи'] || '').startsWith('ЗРС'));

        // Keep only АУП (ID: 157) and its descendants in the department structure
        if (state.departments && state.departments.length > 0) {
          const allowedDeptIds = new Set(['157']);
          let added = true;
          while (added) {
            added = false;
            state.departments.forEach(d => {
              const parentId = String(d.PARENT || '');
              const id = String(d.ID);
              if (parentId && allowedDeptIds.has(parentId) && !allowedDeptIds.has(id)) {
                allowedDeptIds.add(id);
                added = true;
              }
            });
          }
          const allowedDeptNames = new Set();
          state.departments.forEach(d => {
            if (allowedDeptIds.has(String(d.ID))) {
              allowedDeptNames.add(d.NAME);
            }
          });
          filtered = filtered.filter(row => allowedDeptNames.has(row['Отдел']));
        }
        
        const range = getPeriodRange(period);
        if (range) {
          const { start, end } = range;

          // Narrow what is already department-filtered — never restart from state.rows,
          // or non-АУП people leak back in whenever a period is selected.
          filtered = filtered.filter((row) => {
            const parseDate = (rawKey, strKey) => {
              if (row[rawKey]) {
                const d = new Date(row[rawKey]);
                if (!Number.isNaN(d.getTime())) return d;
              }
              return parseDateStr(row[strKey]);
            };

            const created = parseDate('createdDateRaw', 'Дата создания');
            const deadline = parseDate('deadlineRaw', 'Дедлайн');
            const closed = parseDate('closedDateRaw', 'Дата закрытия');

            const isDeadlineIn = deadline && deadline >= start && deadline <= end;

            return isDeadlineIn;
          });
        }
        
        // Apply name search filter
        const q = state.searchQuery.toLowerCase().trim();
        if (q) {
          const matchedPeople = new Set();
          filtered.forEach(row => {
            const executor = (row['Исполнитель'] || '').toLowerCase();
            const creator = (row['Постановщик'] || '').toLowerCase();
            if (executor.includes(q)) matchedPeople.add(row['Исполнитель']);
            if (creator.includes(q)) matchedPeople.add(row['Постановщик']);
          });
          filtered = filtered.filter(row => matchedPeople.has(row['Исполнитель']) || matchedPeople.has(row['Постановщик']));
        }

        state.filteredRows = filtered;
        
        // We do NOT clear/re-populate state.expandedNodes here anymore.
        // This ensures the tree starts collapsed by default initially,
        // and preserves manual expanded states when filters are changed or auto-refreshed.
        
        renderTable();
      }

      function isTvBrowser() {
        const ua = String(navigator.userAgent || '');
        return /SmartTV|Tizen|Web0S|WebOS|NetCast|HbbTV|TV\b/i.test(ua);
      }

      // Smart TV browsers are more stable with plain XHR than with fetch.
      function requestReportXHR(method) {
        return new Promise((resolve, reject) => {
          try {
            const xhr = new XMLHttpRequest();
            xhr.open(method, `/api/task-report?t=${Date.now()}`, true);
            xhr.timeout = 55000;
            xhr.setRequestHeader('Accept', 'application/json');
            xhr.setRequestHeader('Cache-Control', 'no-store');
            xhr.setRequestHeader('Pragma', 'no-cache');
            xhr.onload = () => {
              if (xhr.status < 200 || xhr.status >= 300) {
                try {
                  const errorPayload = JSON.parse(xhr.responseText || '{}');
                  reject(new Error(errorPayload.error || `Ошибка сервера ${xhr.status}`));
                } catch (e) {
                  reject(new Error(`Ошибка сервера ${xhr.status}`));
                }
                return;
              }
              try {
                const data = JSON.parse(xhr.responseText || '{}');
                resolve(data);
              } catch (e) {
                reject(new Error('Некорректный ответ сервера'));
              }
            };
            xhr.onerror = () => reject(new Error('Нет связи с сервером'));
            xhr.ontimeout = () => reject(new Error('Превышено время ожидания'));
            xhr.send();
          } catch (e) {
            reject(e);
          }
        });
      }

      // Prefer XHR on TVs, otherwise fall back to it when fetch breaks at network layer.
      async function requestReport(method) {
        if (isTvBrowser() || typeof fetch !== 'function') {
          return requestReportXHR(method);
        }

        const url = `/api/task-report?t=${Date.now()}`;
        try {
          const response = await fetch(url, { method });
          return await response.json();
        } catch (e) {
          return requestReportXHR(method);
        }
      }

      // Normalize AI importance (value 1-10) to a 0-5 score added on top of status points
      function normalizeImportance(value) {
        const v = parseFloat(value);
        if (!v || isNaN(v)) return 0;
        if (v <= 3) return 0;       // нет ценности
        if (v <= 6) return 2.5;     // средняя ценность
        return 5;                   // критично/ценно
      }

      let aiScoresCache = null;
      async function mergeAiScores() {
        try {
          if (!aiScoresCache) {
            const resp = await fetch('/ai-scores.json', { cache: 'no-store' });
            aiScoresCache = resp.ok ? await resp.json() : {};
          }
        } catch { aiScoresCache = {}; }

        state.rows.forEach(row => {
          const id = String(row['ID задачи']);
          const ai = aiScoresCache[id];
          if (ai && ai.value != null) {
            row['AI важность'] = ai.value;
            row['AI важность (0-5)'] = normalizeImportance(ai.value);
            row['AI рекомендация'] = ai.recommendation || '';
          } else {
            row['AI важность'] = null;
            row['AI важность (0-5)'] = 0;
            row['AI рекомендация'] = '';
          }
        });
      }

      async function loadReport(method = 'GET') {
        ids.errorBox.hidden = true;
        
        const isFirstLoad = state.rows.length === 0;
        if (isFirstLoad) {
          ids.loadingBox.hidden = false;
          ids.tableWrap.hidden = true;
          ids.galleryWrap.hidden = true;
        } else {
          if (ids.syncIndicator) ids.syncIndicator.hidden = false;
        }
        
        if (ids.refreshBtn) ids.refreshBtn.disabled = true;

        try {
          const payload = await requestReport(method);
          if (!payload.ok) {
            throw new Error(payload.error || 'Не удалось загрузить отчет');
          }

          state.columns = payload.columns;
          state.rows = payload.rows;
          await mergeAiScores();
          state.departments = payload.departments || [];
          state.allEmployees = payload.allEmployees || [];
          state.refreshIntervalMs = payload.refreshIntervalMs || state.refreshIntervalMs;
          state.portalHost = payload.portalHost || null;

          ids.fetchedAt.textContent = formatDate(payload.fetchedAt);

          applyFilters();
          scheduleRefresh();
        } catch (error) {
          ids.errorBox.hidden = false;
          ids.errorBox.textContent = error.message || 'Ошибка загрузки отчета';
        } finally {
          ids.loadingBox.hidden = true;
          if (ids.syncIndicator) ids.syncIndicator.hidden = true;
          if (ids.refreshBtn) ids.refreshBtn.disabled = false;
        }
      }

      function scheduleRefresh() {
        if (state.refreshTimer) {
          clearTimeout(state.refreshTimer);
        }

        state.refreshTimer = setTimeout(() => {
          loadReport('GET');
        }, state.refreshIntervalMs);
      }

      if (ids.refreshBtn) {
        ids.refreshBtn.addEventListener('click', () => loadReport('POST'));
      }

      if (ids.periodSelect) {
        // Dynamically set actual names for current and previous months
        const now = new Date();
        const monthNames = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];
        const currentMonthName = monthNames[now.getMonth()];
        const prevMonthName = monthNames[(now.getMonth() + 11) % 12];
        
        const monthOpt = ids.periodSelect.querySelector('option[value="month"]');
        if (monthOpt) monthOpt.textContent = currentMonthName;
        
        const lastMonthOpt = ids.periodSelect.querySelector('option[value="lastMonth"]');
        if (lastMonthOpt) lastMonthOpt.textContent = prevMonthName;

        // Restore saved period preference. Default is «Все время»: the OP plan runs
        // to 2027, so a month-wide window hides most of it.
        let savedPeriod = localStorage.getItem('dashboard_period');
        // One-time reset for anyone still carrying the previous 'month' default
        if (!localStorage.getItem('dashboard_period_default_all')) {
          savedPeriod = 'all';
          localStorage.setItem('dashboard_period', 'all');
          localStorage.setItem('dashboard_period_default_all', '1');
        }
        if (!savedPeriod) savedPeriod = 'all';
        
        ids.periodSelect.value = savedPeriod;
        
        ids.periodSelect.addEventListener('change', () => {
          applyFilters();
          localStorage.setItem('dashboard_period', ids.periodSelect.value);
        });
      }

      // Search input with 200ms debounce
      if (ids.searchInput) {
        let searchTimer = null;
        ids.searchInput.addEventListener('input', () => {
          clearTimeout(searchTimer);
          const val = ids.searchInput.value;
          ids.searchClear.classList.toggle('visible', val.length > 0);
          searchTimer = setTimeout(() => {
            state.searchQuery = val;
            applyFilters();
          }, 200);
        });
        ids.searchClear.addEventListener('click', () => {
          ids.searchInput.value = '';
          ids.searchClear.classList.remove('visible');
          state.searchQuery = '';
          applyFilters();
          ids.searchInput.focus();
        });
      }

      // View switcher
      function setView(mode) {
        state.viewMode = mode;
        ids.viewBtn1.classList.toggle('active', mode === 'table1');
        ids.viewBtn2.classList.toggle('active', mode === 'table2');
        ids.viewBtn3.classList.toggle('active', mode === 'table3');
        ids.viewBtn4.classList.toggle('active', mode === 'table4');
        if (ids.viewBtn5) ids.viewBtn5.classList.toggle('active', mode === 'table5');
        if (ids.viewBtn6) ids.viewBtn6.classList.toggle('active', mode === 'table6');
        if (ids.viewBtn7) ids.viewBtn7.classList.toggle('active', mode === 'table7');
        renderTable();
      }
      if (ids.viewBtn1) ids.viewBtn1.addEventListener('click', () => setView('table1'));
      if (ids.viewBtn2) ids.viewBtn2.addEventListener('click', () => setView('table2'));
      if (ids.viewBtn3) ids.viewBtn3.addEventListener('click', () => setView('table3'));
      if (ids.viewBtn4) ids.viewBtn4.addEventListener('click', () => setView('table4'));
      if (ids.viewBtn5) ids.viewBtn5.addEventListener('click', () => setView('table5'));
      if (ids.viewBtn6) ids.viewBtn6.addEventListener('click', () => setView('table6'));
      if (ids.viewBtn7) ids.viewBtn7.addEventListener('click', () => setView('table7'));

      loadReport('GET');


    </script>
  </body>
</html>
